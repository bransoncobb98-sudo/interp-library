fied", "source_block_raw": "Author: Charles Fuller\nISBN: 978-0573618451\nPublisher: Samuel French, Inc.\nDate (Month/Year): June 2003", "source_notes": [], "cutter": "Not specified", "award_history_raw": "2004 National Qualifier 2013 National Qualifier\n2005 National Qualifier IL State Qualifier\n2006 National Qualifier MO State Qualifier\n2007 National Qualifier OH State Qualifier\n2008 National Qualifier", "copyright_notice": "Not specified", "rights_status": "Not assessed", "attribution_note": "Source and credit information preserved from the uploaded file.", "source_file": "Zooman and the Sign - DI.pdf", "source_pages": 5, "introduction_text": "Two distinct but intersecting worlds: One is the place where 15-year-old Zooman prowls the streets, mugging old ladies and cutting people who get in his way. The other is where the members of the Tate family, hard-working, decent people with blue collar jobs, try to make a life for themselves in a neighborhood overwhelmed by violence and distrust.\n\nWhen 12-year-old Jinny Tate is murdered the two worlds collide and the Bystander Syndrome, (that’s what it's called when a person witnesses a crime, emergency or an individual in need of help and does nothing) becomes shockingly real.\n\nZooman and the Sign by Charles Fuller", "performance_text": "A young black man steps forward, looking at the audience contemptuously. He is wearing a mesh and plastic, green and white baseball cap tilted to the side. A red T-shirt, with the inscription \"ME\" on it, hangs outside a pair of slacks or dungarees designed with two large pockets, one on each side. He is wearing high top sneaks. There are several thin gold and silver chains around his neck.\n\nZOOMAN: (Pg 3) (Casually) I just killed somebody. Little girl, I think. Me and Stockholm turned the comer of this street? -- and there's Gustav from uptown, and this little b**** has to be sittin' on her front steps playin' jacks! But I had tol' Gustav if I eva saw [him] around the Avenue, I'd blow him away. (Shrugs) So I started shootin' and she jes' got hit by one of the strays, that's all. She ain't had no business bein' out there. That street is a war zone -- ain't nobody see her, we was runnin'! And in that neighborhood you supposed to stay indoors, anyway! (Pause) She was in the wrong place at the wrong time -- how am I supposed to feel guilty over somethin' like that?\n\nRACHEL: (Pg 4) I keep seeing her, Reuben -- feeling her all over the room. And I want to reach out and straighten her hair, touch her dress. And I know she's gone- (Pg 7-8) (She is quiet for a moment) This morning, she got up -- took her forever to get her clothes on. She messed around with her food. I told her I was going to call you if she kept it up. But I made her go outside, Reuben -- I made her!\n\nREUBEN: This is not your fault.\n\nRACHEL: She just got on my nerves so bad - I told her three times to clean up that mess she left in her room -- three times! (Quietly) You shoulda been here.\n\nREUBEN: I'm here now -- and I was here the weekend . . .\n\nRACHEL: (Interrupting) Are you going to stay this time or leave -- or what? Because I really can't take it, Reuben! It's too much to ask me to do by myself right now -- I can't deal with this! (Saddened again). I just feel so damn empty! I keep expecting her to come stomping down the stairs—or hear her music playing! How do you get used to an empty room? (Pause) Reuben? You remember the time she put on all my makeup? You shoulda seen her that day -- lipstick from one end of her face to the other -- powder in her hair -- cologne all over – (Shakes her head) She was so much a girl! (beat) (Pg 9) She's the baby, Reuben -- how could they take the baby? (She begins to cry) (The doorbell rings – Reuben opens the door).\n\nJACKSON: (Pg 13-14) Hello, I'm Donald Jackson -- I live down the street? My wife, she was in the back hangin' clothes when it happened. By the time she got to the front door, them boys was halfway up the block. She didn't see nothin'-and me, I was at work, -- but my wife said there was something y'all might want to know- Cop told her he went to every house on the block and not one person claim they saw anything.\n\nREUBEN: What? There's forty-fifty families around here!\n\nJACKSON: It seemed strange to my wife too, 'cause she said when she came outside, everybody in the block was on their porch. About half on your side, and most of them on my side.\n\nRACHEL: (Pg 15) (Shouting) They were all out there! I saw Mrs. Smith standing by her front door. Dottie Henson was hanging out her window! They all saw it. They were all outside when those boys ran through here! They watched her die! (Breaks down crying) I saw them! I saw them! I saw them! ***** Scene*****\n\nZOOMAN: (Pg 16) When you got nothin’ to do, come to the Zoo! (Quieter) First couple hours are the worse. The big, blue fools are probably sweeping the neighborhood by now, picking up everybody in sight. (Sudden mood swing) I got up this mornin' and felt like killing somebody! So what? Gustav is just lucky it ain't him! (beat) I got picked up twenty-one times las' year! Every time somebody black did somethin' and the cops didn't have a name? They busted me! All young n*****s look alike! I was in Juvenile \"D\" eighteen months. (Pause) (Pg 17) Tomorrow's my little sista's' birthday! Not my sista here -- a half sista in Birmingham -- she'll be ten. She's down there with my fatha's people. ***** Scene*****\n\nREUBEN: I'm tellin' you, Rachel, it was like they didn't know me! Mr. Davis, and Gibson down the street? They didn't even answer the door! I go down the street to Julius Williams' house, and he acts like he didn't know we had a daughter! Not one damn person on the block claims they saw anything! (Pg 18) What happens if the police catch the boys they think did it, and nobody comes forward to identify them? They go free? Me and Rachel been livin' here fifteen-sixteen years! Jinny was born on this block! And they all act like strangers -- what's wrong with them?\n\nRACHEL: (Pg 22) I don't want to live here anymore! You can't walk the streets -- And nobody gives a damn! I even had to call the police myself -- leave my baby because I didn't hear a siren! They stood on their porches with their mouths open! What if it had been Grace's little girl, Denise? Or Mr. Davis' granddaughter Phyllis? (On the verge of tears) (Pg 24) Reuben, I think I'm just gonna explode and die in a minute! And keep exploding -- and dying, and dying -- over, and over, and over. *****Scene – 3 days later after Jinny’s funeral*****\n\nREUBEN: (Pg 26) Losing Jinny was like waking up and discovering the sun had a hole in it. She had a way of smiling at you, made you feel somebody had given you a gift. I wanted to see her grown -- bring a boy around here for me to meet -- do something-be something! Twelve years old ain't nothin'! (Slight pause) So, I went downtown this morning, and had this sign made to hang over our porch. Get these folks off their asses. It sure can't hurt nobody. But maybe it'll make somebody come forward. (hangs the sign – he looks up)\n\nVOICE OVER: THE KILLERS OF OUR DAUGHTER JINNY ARE FREE ON THE STREETS BECAUSE OUR NEIGHBORS WILL NOT IDENTIFY THEM! *****Scene – a day later*****\n\nGRACE: (Pg 31-32) (Doorbell rings, outside) Rachel. It's me honey, Grace! (Rachel opens the door) How you feelin', girl? I just dropped by to pay my respects. I think I woulda went out of my mind if it hada been Denise-I don't know how you can stand it. They'd-a had to carry me to the hospital! They'd-a had to strap me down! (Pause, then business-like) I am really sorry it happened, Rachel. (Pg 33) I want to ask you one thing. Why did you let Reuben hang that sign? He's got people around here climbing the walls! Don't none of them appreciate it -- they planning to hold a block meeting about it. (Pause) And the truth is, it makes the whole street look bad. Thing like that lumps the good with the bad -- and every time you ody -- you don't leave no little girl sittin' on her steps by herself nowadays! He shoulda known better -- what kinda fatha is he? (Pause) (Pg 54) I'll be off your streets soon, don't worry -- I just got one more thing to do. (Zooman starts boldly toward the Tate house, hollering, a knife in his hand) Hey! This is Zooman out here! (He reaches up and begins to rip and tear at the sign) Don't nobody do this shit! You don't send people after me! You hear that? This is Zoo man you [messin’] with! Come on out! (Shots are fired through the window of the Tate residence. The shot hits Zooman and knocks him down) I'm Zooman. F*** you! (Zooman dies)\n\nRACHEL: (Pg 56) Oh, Reuben -- oh my God, Reuben.\n\nREUBEN: I know, baby. I know.\n\nVOICE OVER: (as Reuben hangs another sign on his porch) HERE, LESTER TOHNSON WAS KILLED. HE WILL BE MISSED BY FAMILY AND FRIENDS. HE WAS KNOWN AS ZOOMAN", "text_layout": "prose", "intro_boundary": "High", "teaser_present": "Yes", "speaker_labels": ["ZOOMAN", "RACHEL", "REUBEN", "JACKSON", "VOICE OVER", "GRACE"], "character_count": 6, "word_count": 1541, "intro_word_count": 108, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": ["Text repair: 'if l eva saw' -> 'if I eva saw' in performance_text (Font-encoding error in the source PDF's text layer: lowercase L where capital I is printed. Approved: director, 2026-09-30). The text before repair is kept in text_raw.", "Text repair: 'THE KlLLERS OF OUR DAUGHTER' -> 'THE KILLERS OF OUR DAUGHTER' in performance_text (Font-encoding error in the source PDF's text layer: lowercase L where capital I is printed. Same error class as the approved correct   [/\bslurs?\b|\bdiscrimination\b/, "Discrimination/Slurs"], [/\bdeath\b/, "Death"], [/\bgrief\b/, "Grief"], [/\bwar\b/, "War/Trauma"], [/\bmental health\b/, "Mental Health"],
];
const NEG_RE = /\b(?:no|without|not about|avoid(?:ing)?|free of|nothing about)\s+(?:any\s+)?((?:self[- ]harm|sexual assault|sexual content|mental health|substance use|[a-z-]+))\b/g;
const TIME_RE = /\b(?:under|less than|shorter than|over|more than|longer than|about|around|up to|at most)?\s*\d+(?:\.\d+)?\s*(?:-|to)?\s*\d*\s*(?:min(?:ute)?s?|sec(?:ond)?s?)\b/g;
const VAGUE_TIME_RE = /\b(?:short|long|quick|brief)\b/g;
const STOP = new Set("a an the for to of in on at and or with about that this is are be it its me my i we you please some something need needs want wants looking look find get give show any good great nice piece pieces cutting cuttings interp interpretation selection selections script scripts student students competition tournament speech debate preferably prefer maybe really very like would could should one ones also just only who whose what which from by as if has have having".split(" "));

function parseQuery(q){
  let s = " " + (q || "").toLowerCase().replace(/[“”]/g,'"').replace(/[’‘]/g,"'") + " ";
  const constraints = [], excludes = [], ignored = [];
  s = s.replace(TIME_RE, m => { if (m.trim()) ignored.push(m.trim()); return " "; });
  s = s.replace(NEG_RE, (m, what) => {
    const hit = NEG.find(([re]) => re.test(what));
    if (hit && !excludes.includes(hit[1])) excludes.push(hit[1]);
    return hit ? " " : m;
  });
  for (const e of LEX) { if (e.re.test(s)) { e.parts.forEach(p => constraints.push({...p})); s = s.replace(new RegExp(e.re.source, "g"), " "); } }
  s = s.replace(VAGUE_TIME_RE, m => { ignored.push(m); return " "; });
  const terms = s.split(/[^\p{L}\p{N}'-]+/u).map(t => t.replace(/^['-]+|['-]+$/g,"")).filter(t => t.length > 1 && !STOP.has(t));
  return {constraints, excludes, terms, ignored};
}

/* ---------------- search model ---------------- */
function hayOf(r){
  if (r._h) return r._h;
  const sel = (r.selections || []).map(s => [s.author, s.work_title, s.publisher].join(" ")).join(" ");
  const strong = [r.title, r.author, r.work_title, r.publisher, r.cutter, sel].join(" ").toLowerCase();
  const mid = [(r.themes||[]).join(" "), r.subject_matter, (r.tone||[]).join(" "), (r.content_warnings||[]).join(" "), r.literary_form, r.event].join(" ").toLowerCase();
  const text = (r.introduction_text + " " + r.performance_text).replace(/\([^()]*\)/g," ").toLowerCase();
  return (r._h = {strong, mid, text});
}
function stem(t){ return t.length > 4 ? t.replace(/(ies)$/,"y").replace(/(es|s)$/,"") : t; }
function termScore(r, t){
  const h = hayOf(r), re = new RegExp("\\b" + stem(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return (re.test(h.strong) ? 5 : 0) + (re.test(h.mid) ? 3 : 0) + (re.test(h.text) ? 1 : 0);
}
const emptyWord = (r, f) => (["tone","content_warnings","difficulty","audience_level","literary_form","performance_demands"].includes(f) && !assessed(r, f)) ? "not yet classified" : "none";
let state = {q:"", f:{}, x:new Set(), dismiss:new Set(), verified:false, sort:"title"};

function buildConstraints(){
  const cs = [], parsed = parseQuery(state.q);
  parsed.constraints.forEach(c => { if (!state.dismiss.has(c.label)) cs.push({id:"q:"+c.label, label:c.label, kind:"query",
    test:r => c.any.some(([f,v]) => vals(r,f).includes(v)) || (c.text ? c.text.test(hayOf(r).mid) : false),
    want:c.label, actual:r => { const f = c.any[0][0]; return fieldLabel(f).toLowerCase() + ": " + (vals(r,f).join(", ") || emptyWord(r,f)); }}); });
  const ex = new Set([...parsed.excludes, ...state.x]);
  ex.forEach(w => { const lab = "Leave out: " + w; if (!state.dismiss.has(lab)) cs.push({id:"x:"+w, label:lab, kind: state.x.has(w) ? "facet-x" : "query", not:true,
    test:r => assessed(r, "content_warnings") && !(r.content_warnings||[]).includes(w),
    want:"no " + w.toLowerCase(), actual:r => assessed(r,"content_warnings") ? "content warnings include " + w : "content warnings not yet classified"}); });
  parsed.terms.forEach(t => { if (!state.dismiss.has("Keyword: " + t)) cs.push({id:"t:"+t, label:"Keyword: " + t, kind:"term", term:t,
    test:r => termScore(r,t) > 0, want:"the word “" + t + "”", actual:() => "not found"}); });
  Object.entries(state.f).forEach(([f, set]) => { if (set.size) cs.push({id:"facet:"+f, label:fieldLabel(f) + ": " + [...set].join(" or "), kind:"facet", field:f,
    test:r => [...set].some(v => vals(r,f).includes(v)),
    want:fieldLabel(f) + " " + [...set].slice(0,3).join(" or ") + (set.size > 3 ? " or similar" : ""),
    actual:r => vals(r,f).join(", ") || emptyWord(r,f)}); });
  return {cs, parsed};
}

function run(){
  const {cs, parsed} = buildConstraints();
  const pool = RECS.filter(r => !state.verified || r.human_verified);
  const score = r => cs.filter(c => c.kind === "term").reduce((a,c) => a + termScore(r, c.term), 0);
  let exact = [], related = [];
  if (!cs.length) exact = pool.map(r => ({r, unmet:[], met:0, score:0}));
  else pool.forEach(r => {
    const unmet = cs.filter(c => !c.test(r)), met = cs.length - unmet.length, x = {r, unmet, met, score:score(r)};
    if (!unmet.length) exact.push(x); else if (met > 0) related.push(x);
  });
  const cmpTitle = (a,b) => a.r.title.localeCompare(b.r.title, undefined, {numeric:true});
  const sorters = {best:(a,b) => b.score - a.score || cmpTitle(a,b), title:cmpTitle,
    shortw:(a,b) => a.r.word_count - b.r.word_count || cmpTitle(a,b), longw:(a,b) => b.r.word_count - a.r.word_count || cmpTitle(a,b)};
  exact.sort(sorters[state.sort] || sorters.title);
  related.sort((a,b) => b.met - a.met || b.score - a.score || cmpTitle(a,b));
  return {cs, parsed, pool, exact, related: related.slice(0, 12)};
}

function facetCounts(cs, pool){
  const out = {};
  LIB.facets.forEach(f => {
    const others = cs.filter(c => c.id !== "facet:" + f), counts = {};
    pool.forEach(r => { if (others.every(c => c.test(r))) vals(r,f).forEach(v => counts[v] = (counts[v]||0) + 1); });
    out[f] = counts;
  });
  return out;
}

/* ---------------- URL state ---------------- */
function stateToParams(){
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  Object.entries(state.f).forEach(([f,s]) => { if (s.size) p.set("f."+f, [...s].join("|")); });
  if (state.x.size) p.set("xw", [...state.x].join("|"));
  if (state.dismiss.size) p.set("x", [...state.dismiss].join("|"));
  if (state.verified) p.set("v","1");
  if (state.sort !== "title") p.set("s", state.sort);
  return p;
}
function paramsToState(p){
  state = {q:p.get("q")||"", f:{}, x:new Set((p.get("xw")||"").split("|").filter(Boolean)), dismiss:new Set((p.get("x")||"").split("|").filter(Boolean)), verified:p.get("v")==="1", sort:p.get("s")||"title"};
  for (const [k,v] of p.entries()) if (k.startsWith("f.")) state.f[k.slice(2)] = new Set(v.split("|").filter(Boolean));
}
function route(){
  const h = location.hash.slice(1) || "/", i = h.indexOf("?");
  return {path: i < 0 ? h : h.slice(0,i), params: new URLSearchParams(i < 0 ? "" : h.slice(i+1))};
}
let muteHash = false;
function writeHash(){
  const q = stateToParams().toString(), h = "#/" + (q ? "?" + q : "");
  try { history.replaceState(null, "", h); }
  catch (e) { muteHash = true; location.hash = h; }   // some browsers block replaceState on file:// pages
}

  {t:"Has a teaser", f:"teaser_present", v:["Yes"]},

const sameSet = (set, arr) => set && set.size === arr.length && arr.every(v => set.has(v));

    `<label class="opt" data-v="${esc(v)}"><input type="checkbox" data-f="${f}" value="${esc(v)}"><span>${esc(v)}</span><span class="c"></span></label>`).join("")}</fieldset></details>`;

  let t; $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => setQ(e.target.value), 250); });
  $$(".ex").forEach(b => b.onclick = () => { $("#q").value = b.textContent; setQ(b.textContent); });

    if (!i.dataset.f) return;

    i.checked ? set.add(i.value) : set.delete(i.value); writeHash(); update(); });

  $("#browse").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (!b) return;
    const d = BROWSE[+b.dataset.i];

function syncControls(){

}

function chips(arr, cls=""){ return arr.length ? `<ul class="tags">${arr.map(t => `<li class="chip ${cls}">${esc(t)}</li>`).join("")}</ul>` : ""; }
function entry(x, withWhy){
  const r = x.r, q = stateToParams().toString();
  const href = "#/c/" + r.id + (q ? "?from=" + encodeURIComponent(q) : "");
  const prog = isProgram(r);
  const cls = [r.event, prog ? "Program of " + r.selections.length + " selections" : "", known(r.literary_form) ? r.literary_form : "",
    r.difficulty ? r.difficulty + " difficulty" : "", r.word_count + " spoken words", r.teaser_present === "Yes" ? "Teaser" : ""].filter(Boolean);
  const from = prog ? [...new Set(r.selections.map(s => s.work_title).filter(known))].join("; ") : r.work_title;
  const cw = assessed(r, "content_warnings") && (r.content_warnings||[]).length ? `<p class="tags"><span class="chip warn">Content: ${esc(r.content_warnings.join(", "))}</span></p>` : "";
  const why = withWhy && x.unmet.length ? `<p class="why"><b>Does not match:</b> ${x.unmet.map(c => esc(c.want) + " (this one: " + esc(c.actual(r)) + ")").join("; ")}</p>` : "";
  return `<li class="entry"><h3><a href="${href}">${esc(r.title)}</a></h3>
    <p class="who">${known(r.author) ? "By " + esc(r.author) : "Author not specified"}</p>
    <dl class="src">${known(from) ? `<div><dt>From</dt><dd>${esc(from)}</dd></div>` : ""}${known(r.publisher) ? `<div><dt>Publisher</dt><dd>${esc(r.publisher)}</dd></div>` : ""}</dl>
    <ul class="tags" aria-label="Details">${cls.map(t => `<li class="chip">${esc(t)}</li>`).join("")}</ul>
    ${chips(r.tone || [], "soft")}${cw}${why}
    <a class="btn" href="${href}">Open cutting<span class="sr">: ${esc(r.title)}</span></a></li>`;
}

function update(){
  const res = run(), counts = facetCounts(res.cs, res.pool);
  const u = [];
  res.cs.filter(c => c.kind !== "facet").forEach(c => u.push(`<span class="pill${c.not ? " not" : ""}">${esc(c.label)}<button type="button" data-x="${esc(c.label)}" aria-label="Remove ${esc(c.label)}">&times;</button></span>`));
  $("#understood").innerHTML = (u.length ? `<span class="lead">Searching for</span>${u.join("")}` : "") +
    (res.parsed.ignored.length ? `<span class="ignored">Not used: &ldquo;${esc(res.parsed.ignored.join("”, “"))}&rdquo;. This library does not estimate run times.</span>` : "");
  $$("#facets label.opt").forEach(l => {
    const inp = $("input", l); if (inp.dataset.x) return;
    const f = inp.dataset.f, v = l.dataset.v, n = (counts[f] || {})[v] || 0;
    l.hidden = !(n > 0 || inp.checked); $(".c", l).textContent = n;
  });
  $$("#facets details.facet[data-f]").forEach(d => { d.hidden = !$$("label.opt:not([hidden])", d).length; });
  const active = Object.values(state.f).reduce((a,s) => a + s.size, 0) + state.x.size + (state.verified ? 1 : 0);
  $("#fsum").textContent = "Filters" + (active ? " (" + active + " active)" : "");
  $("#browse").innerHTML = BROWSE.map((d,i) => {
    const n = d.clear ? RECS.length : RECS.filter(r => d.v.some(v => vals(r,d.f).includes(v))).length;
    const on = d.clear ? (!res.cs.length && !state.verified) : sameSet(state.f[d.f], d.v);
    return (n === 0 && !on && !d.clear) ? "" : `<button type="button" data-i="${i}" aria-pressed="${on}">${esc(d.t)}<span class="n">${n}</span></button>`;
  }).join("");
  const hasQ = res.cs.length > 0;
  let html = `<div class="rhead"><h2 id="rc" role="status">${hasQ ? "Exact matches (" + res.exact.length + ")" : "All cuttings (" + res.exact.length + ")"}</h2>
    <label>Sort by <select id="sort">${[["title","Title"],["best","Best match"],["shortw","Fewest words first"],["longw","Most words first"]].map(([v,t]) => `<option value="${v}" ${state.sort===v?"selected":""}>${t}</option>`).join("")}</select></label></div>`;
  if (!RECS.length) html += `<div class="empty"><p><b>The library is empty.</b></p></div>`;
  else if (!res.exact.length) html += `<div class="empty"><p><b>No cutting matches every part of this search.</b></p><p>${res.related.length ? "Related results are listed below." : "Try removing a filter or a word."}</p><p><button class="btn quiet small" data-clear type="button">Clear search and filters</button></p></div>`;
  else html += `<ul class="entries">${res.exact.map(x => entry(x,false)).join("")}</ul>`;
  if (res.related.length) html += `<div class="rsec"><h2>Related results (${res.related.length})</h2><p>These meet some of your criteria but not all. Each one says what does not match.</p><ul class="entries">${res.related.map(x => entry(x,true)).join("")}</ul></div>`;
  $("#results").innerHTML = html;
}

/* ---------------- detail page ---------------- */
function origin(o){ return {ai:"AI-suggested", human:"Entered by reviewer", source:"From the source file", computed:"Calculated"}[o] || o; }
function fmtVal(v){ if (Array.isArray(v)) return v.join("; ") || "None"; return v === "" || v == null ? "—" : String(v); }
const PG = /\(Pg\.?\s*[\d\s,–-]+\)/g;
const SPK = /^([A-Z][A-Z0-9 .'’/#&-]{0,28}:)(?=\s|$)/;
function renderText(t){
  return t.split(/\n\n+/).filter(p => p.trim()).map(p => {
    let h = esc(p);
    h = h.replace(/\((?!Pg\.?\s*\d)([^()]{1,400})\)/g, '<em class="dir">($1)</em>');
    h = h.replace(PG, m => '<span class="pg">' + m + '</span>');
    h = h.split("\n").map(line => line.replace(SPK, '<b class="spk">$1</b>')).join("\n");
    return "<p" + (p.includes("\n") ? ' class="verse"' : "") + ">" + h + "</p>";
  }).join("");
}
function orderFromParams(fromQs){
  const saved = state; paramsToState(new URLSearchParams(fromQs || "")); const res = run();
  const ids = res.exact.map(x => x.r.id).concat(res.related.map(x => x.r.id)); state = saved; return ids;
}
function plainText(r){
  const pg = !document.body.classList.contains("hide-pg");

  return r.title + (known(r.author) ? "\nBy " + r.author : "") + (r.introduction_text ? "\n\nINTRODUCTION\n" + strip(r.introduction_text) : "") +

    (known(r.publisher) ? "; " + r.publisher : "") + (known(r.copyright_notice) ? "\n" + r.copyright_notice : "");
}
async function copyText(r, btn){

    e.preventDefault();
    const reason = $("#rmr").value.trim(); if (!reason) { $("#rms").textContent = "Please give a reason."; return; }
    $("#rmgo").disabled = true;
    try {
      const res = await fetch("/api/takedown", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id:r.id, reason, email:$("#rme").value.trim()})});
      const j = await res.json().catch(() => ({}));
      if (!res.ok) { $("#rms").textContent = j.error || "The request was not sent."; $("#rmgo").disabled = false; return; }
      const i = RECS.findIndex(x => x.id === r.id); if (i >= 0) RECS.splice(i, 1);
      d.close(); location.hash = "#/"; alert(j.message || "Thank you. The cutting is now hidden.");
    } catch (err) { $("#rms").textContent = "Could not reach the library. The request was not sent."; $("#rmgo").disabled = false; }
  });
}
function buildDetail(id, fromQs){
  const r = RECS.find(x => x.id === id), main = $("#main");
  if (!r) { main.innerHTML = `<div class="detail"><p class="empty">No cutting with ID ${esc(id)} is in this library. <a href="#/">Return to search</a></p></div>`; return; }
  const order = orderFromParams(fromQs), idx = order.indexOf(id);
  const prev = idx > 0 ? order[idx-1] : null, next = idx >= 0 && idx < order.length-1 ? order[idx+1] : null;
  const nav = tid => "#/c/" + tid + (fromQs ? "?from=" + encodeURIComponent(fromQs) : "");
  const back = "#/" + (fromQs ? "?" + fromQs : "");
  const aiCount = Object.values(r.provenance).filter(p => p.origin === "ai").length;
  const cl = (k,v,extra) => known(v) && v !== "" ? `<div><dt>${k}</dt><dd>${esc(v)}${extra || ""}</dd></div>` : "";
  const cla = (k,f) => `<div><dt>${k}</dt><dd>${esc(assessedWord(r,f))}${isAI(r,f) ? ' <span class="lab">(AI-suggested)</span>' : ""}</dd></div>`;
  const provRows = Object.keys(r.provenance).filter(k => r.provenance[k].origin !== "computed" && !["performance_text","introduction_text","source_block_raw"].includes(k)).map(k => { const p = r.provenance[k];
    return `<tr><th scope="row">${esc(fieldLabel(k))}</th><td>${esc(fmtVal(r[k]))}</td><td>${esc(origin(p.origin))}</td><td>${esc(p.confidence || "")}</td><td>${esc(p.evidence || "")}</td></tr>`; }).join("");
  const hasPg = PG.test(r.performance_text + r.introduction_text); PG.lastIndex = 0;
  main.innerHTML = `<article class="detail" aria-labelledby="dt">
    <div class="print-head"><h1>${esc(r.title)}</h1>${known(r.author) ? `<p>By ${esc(r.author)}</p>` : ""}${known(r.work_title) ? `<p>From ${esc(r.work_title)}${known(r.publisher) ? ", " + esc(r.publisher) : ""}</p>` : ""}</div>
    <div class="crumbs no-print"><a href="${back}">Return to search</a>
      <span class="pn">${prev ? `<a class="btn quiet small" href="${nav(prev)}">Previous</a>` : ""}${next ? `<a class="btn quiet small" href="${nav(next)}">Next</a>` : ""}</span></div>
    <header class="no-print"><h1 id="dt" tabindex="-1">${esc(r.title)}</h1>
      <p class="byline">${known(r.author) ? "By " + esc(r.author) : "Author not specified"}</p>
      ${chips(r.tone || [], "soft")}
      <dl class="facts">
        ${cl("From", r.work_title)}${cl("Publisher", r.publisher)}${cl("Publication date as stated", r.publication_date_raw)}${cl("ISBN or ISSN", r.isbn)}
        ${cl("Event as filed", r.event)}${cl("Filed under", r.performer_category_as_filed)}
        ${cla("Literary form", "literary_form")}${cla("Tone", "tone")}${cla("Content warnings", "content_warnings")}${cla("Difficulty", "difficulty")}
        ${cla("Performance demands", "performance_demands")}
        <div><dt>Suggested audience level</dt><dd>${assessed(r,"audience_level") && known(r.audience_level) ? esc(r.audience_level) + ' <span class="lab">(' + (isAI(r,"audience_level") ? "AI-suggested; " : "") + "a suggestion, not a judgement of appropriateness)</span>" : "Not assessed"}</dd></div>
        <div><dt>Spoken words</dt><dd>${r.word_count} in the performance text; ${r.intro_word_count} in the introduction</dd></div>
        <div><dt>Labelled speakers</dt><dd>${r.character_count ? r.character_count + " (" + esc(r.speaker_labels.join(", ")) + ")" : "No speaker labels in the text"}</dd></div>
        <div><dt>Teaser before the introduction</dt><dd>${esc(r.teaser_present)}</dd></div>
        <div><dt>Source citation in the file</dt><dd>${esc(r.source_citation)}${r.web_only_source === "Yes" ? " (web link only)" : ""}</dd></div>
        <div><dt>Rights</dt><dd><span class="badge">${esc(r.rights_status)}</span></dd></div>
      </dl>
      ${r.human_verified ? `<p class="notice ok">Checked by a reviewer on ${esc(r.date_verified)}.</p>`
        : `<p class="notice">Not yet checked by a person.${aiCount ? " " + aiCount + " values are AI-suggested; see &ldquo;How this was classified&rdquo; below." : ""}</p>`}
      <div class="actions"><button class="btn" id="print" type="button">Print or save as PDF</button>
        <button class="btn quiet" id="copy" type="button">Copy text</button>
        ${hasPg ? '<label class="toggle"><input type="checkbox" id="pgt"> Show source page references (Pg&nbsp;N)</label>' : ""}
        <button class="btn danger" id="rmb" type="button">Request removal</button>
        <span id="copystatus" class="sr" role="status"></span></div>
    </header>
    ${r.introduction_text ? `<section class="sheet intro" aria-labelledby="ih"><h2 id="ih">Introduction</h2>
      ${r.intro_boundary === "Medium" ? '<p class="small no-print">Where the introduction ends was found from the font alone and has not been checked by a person.</p>' : ""}
      <div class="lines">${renderText(r.introduction_text)}</div></section>` : ""}
    ${isProgram(r) ? r.selections.map(s => `<section class="sheet" aria-labelledby="sel${s.order}">
      <h2 id="sel${s.order}">Selection ${s.order} of ${r.selections.length}${s.position === "before the introduction" ? " (before the introduction)" : ""}</h2>
      <p class="small">${known(s.author) ? "By " + esc(s.author) : "Author not given in its source"}${known(s.work_title) ? ", from " + esc(s.work_title) : ""}. ${s.word_count} spoken words.</p>
      <div class="lines">${renderText(s.text)}</div>
      <div class="no-print"><p class="small"><b>Its source, as printed:</b></p>${s.source_block_raw ? `<pre class="raw">${esc(s.source_block_raw)}</pre>` : "<p class=\"small\">No source block follows this selection in the file.</p>"}
      ${s.award_history_raw ? `<p class="small"><b>Award lines printed with it</b> (not checked):</p><pre class="raw">${esc(s.award_history_raw)}</pre>` : ""}</div>
      <p class="print-only small">Source: ${esc([s.author, s.work_title, s.publisher, s.isbn].filter(known).join(", "))}</p></section>`).join("")
    : `<section class="sheet" aria-labelledby="ph"><h2 id="ph">Performance text${r.teaser_present === "Yes" ? " (the teaser comes first, before the introduction is performed)" : ""}</h2>
      <div class="lines">${renderText(r.performance_text)}</div></section>`}
    <div class="print-foot">Source file: ${esc(r.source_file)}.${known(r.work_title) ? " From " + esc(r.work_title) + "." : ""}${known(r.publisher) ? " " + esc(r.publisher) + "." : ""}${known(r.isbn) ? " ISBN " + esc(r.isbn) + "." : ""} ${esc(r.attribution_note)}${known(r.copyright_notice) ? " " + esc(r.copyright_notice) : ""}</div>
    <div class="no-print">
    <section><h2 class="sec">Source and credits</h2>
      <p class="small">Shown exactly as given in the file.</p>
      ${r.source_block_raw ? `<pre class="raw">${esc(r.source_block_raw)}</pre>` : "<p>No source block in the file.</p>"}
      <p><b>Copyright notice:</b> ${known(r.copyright_notice) ? esc(r.copyright_notice) : "None given in the file."}</p>
      <p><b>Cutting credited to:</b> ${known(r.cutter) ? esc(r.cutter) : "Not credited in the file."}</p>
      ${r.award_history_raw ? `<p><b>Award lines printed in the file</b></p><p class="small">As printed. Not checked, and not facts about this piece.</p><pre class="raw">${esc(r.award_history_raw)}</pre>` : ""}
      <p class="small">${esc(r.attribution_note)} Source file: ${esc(r.source_file)}.</p>
    </section>
    ${(r.also_appears_in||[]).length ? `<section><h2 class="sec">Also appears in</h2><p class="small">These files contain the same text. The cutting is listed once.</p><ul class="simlist">${r.also_appears_in.map(f => `<li>${esc(f)}</li>`).join("")}</ul></section>` : ""}
    ${(r.same_book||[]).length ? `<section><h2 class="sec">From the same book</h2><p class="small">Different pieces cut from the same published book. Not duplicates.</p><ul class="simlist">${r.same_book.map(x => `<li><a href="${nav(x.id)}">${esc(x.title)}</a><br><span>${known(x.author) ? "By " + esc(x.author) : ""}</span></li>`).join("")}</ul></section>` : ""}
    ${(r.similar_versions||[]).length ? `<section><h2 class="sec">Other cuts of this piece</h2><p class="small">Nearly the same text, not identical.</p><ul class="simlist">${r.similar_versions.map(x => `<li><a href="${nav(x.id)}">${esc(x.title)}</a></li>`).join("")}</ul></section>` : ""}
    <details><summary>How this was classified</summary><p>Every value shows where it came from. AI-suggested values include a confidence and the evidence used.</p>
      <table class="prov"><thead><tr><th>Field</th><th>Value</th><th>Origin</th><th>Confidence</th><th>Evidence</th></tr></thead><tbody>${provRows}</tbody></table></details>
    ${(r.ingest_notes||[]).length ? `<details><summary>Extraction notes</summary><ul>${r.ingest_notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>` : ""}
    </div></article>`;
  $("#print").onclick = () => window.print();
  $("#copy").onclick = e => copyText(r, e.currentTarget);
  $("#rmb").onclick = () => removalDialog(r);
  if ($("#pgt")) { $("#pgt").checked = !document.body.classList.contains("hide-pg");
    $("#pgt").onchange = e => { document.body.classList.toggle("hide-pg", !e.target.checked); try { localStorage.setItem("il-pg", e.target.checked ? "1" : "0"); } catch(_){} }; }
  $("#dt").focus();
}

/* ---------------- router ---------------- */
try { if (localStorage.getItem("il-pg") === "1") document.body.classList.remove("hide-pg"); } catch(e){}
let listBuilt = false;
function onRoute(){
  if (muteHash) { muteHash = false; return; }
  const {path, params} = route();
  const m = path.match(/^\/c\/(IC-\d+)$/);
  if (m && LIB.redirects && LIB.redirects[m[1]] && !RECS.find(x => x.id === m[1])) {      // a folded exact duplicate: show the record that stands for it
    location.replace("#/c/" + LIB.redirects[m[1]] + (params.get("from") ? "?from=" + encodeURIComponent(params.get("from")) : "")); return;
  }
  if (m) { listBuilt = false; buildDetail(m[1], params.get("from") || ""); window.scrollTo(0,0); return; }
  paramsToState(params);
  if (!listBuilt || !$("#sform")) { buildList(); listBuilt = true; }
  syncControls(); update();
}
window.addEventListener("hashchange", onRoute);
window.__IL = {parseQuery, run, get state(){ return state; }, set state(s){ state = s; }};   // for automated tests only
onRoute();
})();
</script>
