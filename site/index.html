 in a “play-date” setting with numerous others to see how they fit in.\n\nSharpies by David Narter.", "performance_text": "(BRETT and CHRISTINA are in a waiting room in which there is a single chair upon which is a scattering of brochures and forms. CHRISTINA is pacing. Frequently, they look toward the audience - the window of the playroom.)\n\nCHRISTINA: Oh, God. This is so nerve-wracking.\n\nBRETT: No. Tyler's fine. He'll do fine. (Long pause)\n\nCHRISTINA: Did you talk with him last night?\n\nBRETT: Excuse me?\n\nCHRISTINA: When you two were out for ice cream, you were supposed to talk to him about this.\n\nBRETT: About what? What am I supposed to tell him? Be smart?\n\nCHRISTINA: So you didn't talk to him? Brett, you were supposed to let him know the situation and what was expected of him.\n\nBRETT: Oh, Christina. C'mon. Does it really matter what I say to him? He's going to be doing arts and crafts and listening to story time.\n\nCHRISTINA: Yes, it matters! Some of these kids are going to cry as soon as they get here and some kids are going to be comfortable in the situation and doing what they're supposed to do - maybe going beyond what's expected, Brett. Are you familiar with that expression, Brett? Beyond what's expected?\n\nBRETT: Christina, I'll be happy if he doesn't eat the paste.\n\nBRETT: Seriously, how does watching him play tell them anything about him.\n\nCHRISTINA: It doesn't, Brett. It tells them about us.\n\nBRETT: What?\n\nCHRISTINA: How we parent. That's what they want to know.\n\nBRETT: So this is about us. Don't you think that's a little self- centered?\n\nCHRISTINA: Ugh! So did you tell Tyler anything at all, Brett?\n\nBRETT: Well actually, I told him ... (in an announcer voice) \"kill the competition!\"\n\nCHRISTINA: What are you talking about?\n\nBRETT: It's an ad. It was an ad for Home Depot or something. He was a little freaked out, and I told him it was a figure of speech about competition and doing your best. I told him ... confidence. (reconsiders and then comes back to it) Confidence.\n\nCHRISTINA: Oh. Oh. Well, good.\n\nBRETT: Yeah. You know, I wasn't really talking about this at all though. It was actually - to be honest, I think he was kind of freaked out about the slogan. So, I just kind of generalized.\n\nCHRISTINA: Well, sure. You tell a toddler to \"kill the ... \"\n\nBRETT: Right. Listen, Christina, I said that there's lots of people and you have to do your best if you want to get noticed. That's all.\n\nCHRISTINA: Right. Well good. That's good. That's good. So why didn't you just tell me that when I asked?\n\nBRETT: Because I wasn't really talking about this. I mean I think he really thought about it, but I don't remember if I really said anything specific about today.\n\nCHRISTINA: Hmm. Well, that's fine. I did.\n\nBRETT: Yeah? When?\n\nCHRISTINA: When we were driving in.\n\nBRETT: What'd you say?\n\nCHRISTINA: Same as you.\n\nBRETT: Yeah?\n\nCHRISTINA: Yeah, I told him that there are a lot of other kids who he'll see in his life and a lot in the room today and there are winners and there are losers. I told him it's best to think of himself as the sun and always make sure the teacher can see him shining bright. And that it is his job to be sure no one got in the way of his sunshine. (Long pause)\n\nBRETT: Oh.\n\nCHRISTINA: I just reminded him that it's a big world. And one little person can get crowded out by a lot of the mediocrity around him if he doesn't make sure he gets himself in the front of the line. Just like you - kill the competition.\n\nBRETT: Just like me? I told him to be confident! I didn't tell him to \"kill the competition\"!\n\nCHRISTINA: Well, neither did I.\n\nBRETT: Are you kidding????\n\nCHRISTINA: (realizing this is getting out of hand) Brett. Brett. Listen. Listen. You said it before. This isn't about Tyler. It's about us.\n\nBRETT: I didn't say that. You did.\n\nCHRISTINA: Anyway. We don't want to be arguing when they're watching him. Tyler is going to be Tyler and he's a part of us both. And I'm sure they'll see the best of us when they see him. Okay? Okay?\n\nBRETT: Yeah, you're - right. (looks to audience: a glass through which they can see Tyler play) Hey, there he is!\n\nCHRISTINA: Hey, baby. Who's my little handsome man? (MR. GLENN enters)\n\nMR. GLENN: Oh, he can't see you. That's a one-way window -- or mirror. I suppose it all depends on which side you're on.\n\nBRETT: Well, that's a little creepy.\n\nMR. GLENN: Oh, for the most part it's pretty benign. We use it to evaluate staff members usually. But of course, assuming Tyler is accepted into the program, you're always welcome to watch him play without affecting the ... the chemistry of the classroom environment.\n\nCHRISTINA: Oh. That's nice. What a little fella. He's gonna do a little painting.\n\nMR. GLENN: He's an interesting young man.\n\nCHRISTINA: Really?!\n\nMR. GLENN: Absolutely. We had a good conversation before we went in. He told me he got ice cream last night.\n\nBRETT: Yes he did.\n\nMR. GLENN: He also said something about the radio scaring him. It seems he was a little anxious about it.\n\nCHRISTINA: Really?\n\nBRETT: Yeah. There was some ad - really freaked him out. I changed the station.\n\nCHRISTINA: Yeah. Tyler's a very quiet - well - thoughtful boy. He thinks a lot. (long pause)\n\nMR. GLENN: Well, that's good.\n\nBRETT: Oh, look at that. He's got himself a girlfriend.\n\nCHRISTINA: No, no. Tyler's teaching her how to paint.\n\nBRETT: Yeah, how ‘bout that? They're painting together.\n\nCHRISTINA: No. He's teaching her.\n\nMR. GLENN: Really?\n\nCHRISTINA: He's teaching her how to paint. See he's helping her hold the brush. No. No. Take turns, now. Hmm.\n\nBRETT: Whoa, yeah that's not a lesson. That's a fight.\n\nCHRISTINA: Nonsense, he's helping her, but she's not paying attention.\n\nBRETT: Hmm. Nope they're fighting over that brush. Yeah, that's a fight.\n\nCHRISTINA: Well, of course it's not a fight. Tyler is twice her size. He's helping her.\n\nBRETT: I don't know. Okay, that's a shove.\n\nCHRISTINA: Hey, now! That really was a shove. That little girl just pushed Tyler down. Mr. Glenn, shouldn't the teacher be interceding at some point?\n\nMR. GLENN: I'm not sure that she's seen it yet. Oh! (All of them gasp in horror)\n\nBRETT: Oh, my God. That's just right in her eye!\n\nCHRISTINA: No, of course it isn't.\n\nBRETT: Oh, it's in there.\n\nMR. GLENN: Oh dear. (calling to be heard through the window) Mrs. Schiff!\n\nCHRISTINA: That's not his fault.\n\nBRETT: Christina.\n\nCHRISTINA: It's not his fault. That girl was pulling and he just let go. He was letting her have the brush. He was being generous!\n\nMR. GLENN: Finally, she's noticed.\n\nBRETT: Whoa that was quick!\n\nMR. GLENN: We do have a nurse on sight. And if that button is pushed ... well, as you can see, she's there in an instant.\n\nBRETT: Jeez, I am so sorry ... I don't know what happened there.\n\nCHRISTINA: It was an accident.\n\nMR. GLENN: Of course. Of course it was.\n\nCHRISTINA: Tyler no, no. No, honey. There are other brushes, you don't need that one. Not that one! (Horrified gasp from all three)\n\nBRETT: Oh. That just popped right out.\n\nCHRISTINA: What? Why is she yelling at Tyler? Oh, c'mon now. She's just upsetting him more.\n\nBRETT: (rushing to the door of the observation room) Okay, this is over. I'm going ... (the door is locked) Mr. Glenn. Do you have a key?\n\nMR. GLENN: No. I didn't even know there was a lock.\n\nBRETT: Well, there's something keeping this from opening!\n\nMR. GLENN: Dear God. He's locked us in here.\n\nCHRISTINA: That's ridiculous. Tyler could not have done that.\n\nBRETT: There's no way out!l!\n\nCHRISTINA: Tyler, honey. This is mommy. It's okay. It's okay.\n\nMR. GLENN: He's going for the scissors!\n\nBRETT: No, Tyler!\n\nCHRISTINA: Tyler! Tyler! Use the roundies, honey. Not the sharpies, not the sharpies!\n\n(Both men freeze and look at Christina in shock. Then, looking back at the window, they all gasp in terror)\n\nBRETT: There goes the nurse.\n\nMR. GLENN: (patting his pockets) He's taken my cellphone!\n\nBRETT: Christina. Your phone.\n\nCHRISTINA: Don't be rude, Brett. (Brett makes a dash for her purse and rifles through it till he gets the phone)\n\nCHRISTINA: No. No. Tyler. That's not nice. Gentle hands. Gentle hands.\n\nBRETT: (fumbling with the phone) C'mon! C'mon!\n\nCHRISTINA: Don't you run with those scissors.\n\nMR. GLENN: Why is he climbing up there? (Their eyes follow him up a jungle gym)\n\nCHRISTINA: He's playing king of the mountain! He's a little Moufasa! (She does a tiny wave) Look, Brett. They're all his little subjects! (Their eyes follow him jumping from the jungle gym. Again, the men gasp in horror and Brett drops the phone.)\n\nBRETT: Oh, God.\n\nCHRISTINA: Tyler. Mouths are for food. No biting! No!\n\nMR. GLENN: Oh, that's the entire ear!\n\nCHRISTINA: Tyler, no! People are not food! No! (Suddenly they all exhale.)\n\nMR. GLENN: Oh, dear God.\n\nCHRISTINA: Oh, look who's tired. No. No. Find your own space. Let her sleep. No! (As the men become even more shocked) Hands to yourself, Tyler. Hands to yourself!\n\nMR. GLENN: How did he ... ? He knew exactly where the heart was.\n\nBRETT: Well, that's something.\n\nCHRISTINA: We have a few anatomy CD's. He's very advanced.\n\nMR. GLENN: Dear God, he's walking to window.\n\nBRETT: It's like he can see us.\n\nMR. GLENN: He's looking right at us!\n\nCHRISTINA: Hi, baby. (In baby talk) Who's got the messy red hands? Who's my messy boy? No. No. Wipe on a towel sweety. Not the window.\n\nMR. GLENN: (recoiling in terror) He sees us! He sees us!\n\nCHRISTINA: Don't be silly. He's writing letters. C - 0 -\n\nMR. GLENN: They're backwards. Oh God! He can see us!\n\nCHRISTINA: I know. He is very smart. Aren't you Tyler sweetie! Aren't you!\n\nBRETT: N - F - I - D -\n\nMR. GLENN: Confidence. He spelled confidence.\n\nCHRISTINA: Oh, my little Moufasa is tired. Look at the little angel. He's just gonna lie down and have a \"widdle nappie.\" (She watches him lovingly while Mr. Glenn cowers in the corner, panting)\n\nBRETT: Mr. Glenn. I'm so ... well, I just don't know what to say.\n\nMR. GLENN: There's nothing to say.\n\nBRETT: Of course. Of course ... I just ... this is just... unbelievable.\n\nMR. GLENN: Yes. Yes. (He collects himself and organizes his notes. He then pulls two sheets from the stack.) Well. You'll need to fill out these two forms. And I'll need a copy of Tyler's physical and a copy of your insurance card.", "text_layout": "prose", "intro_boundary": "High", "teaser_present": "Yes", "speaker_labels": ["CHRISTINA", "BRETT", "MR. GLENN"], "character_count": 3, "word_count": 1403, "intro_word_count": 142, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": [], "provenance": {"title": {"origin": "source", "evidence": "Title lines at the top of page 1"}, "author": {"origin": "source", "evidence": "Byline: By David Narter"}, "work_title": {"origin": "source", "evidence": "Source block"}, "publisher": {"origin": "source", "evidence": "Publisher: Smith and Kraus"}, "isbn": {"origin": "source", "evidence": "ISBN/ISSN: 978-1575259338"}, "publication_date_raw": {"origin": "source", "evidence": "Date: March 2019"}, "event": {"origin": "human", "evidence": "Filed by the uploader in the folder for this event"}, "performer_category_as_filed": {"origin": "human", "evidence": "Folder name in the upload"}, "source_citation": {"origin": "computed"}, "web_only_source": {"origin": "computed"}, "intro_boundary": {"origin": "computed"}, "teaser_present": {"origin": "computed"}, "word_count": {"origin": "computed"}, "intro_word_count": {"origin": "computed"}, "speaker_labels": {"origin": "computed"}, "character_count": {"origin": "computed"}, "text_layout": {"origin": "computed"}}, "selections": [], "character_bucket": "2 to 3 labelled speakers", "same_book": [], "similar_versions": []}, {"id": "IC-0040", "record_type": "Cutting", "title": "Therac 25", "event": "Dramatic Interpretation", "performer_category_as_filed": "Any Gender", "author": "Adam Pettle", "work_title": "Not specified", "publisher": "Scirocco Drama", "isbn": "978-1896239705", "publication_date_raw": "Sept 2000", "source_url": "Not specified", "literary_form": "Not specified", "source_block_raw": "Author: Adam Pettle 2003 National Qualifier\nISBN: 978-1896239705 2004 National Qualifier\nPublisher: Scirocco Drama 2005 National Qualifier\nDate (Month/Year): Sept 2000 2007 National Qualifier\n2009 National Qualifier\n2010 National Qualifier\n2014 National Qualifier\nNOTE: Here’s a link to Cat Steven’s Moonshadow to help with the signing parts:\nhttps://www.youtube.com/watch?v=hr0rDW5j1KU", "source_notes": ["NOTE: Here’s a link to Cat Steven’s Moonshadow to help with the signing parts:", "https://www.youtube.com/watch?v=hr0rDW5j1KU"], "cutter": "Not specified", "award_history_raw": "2003 National Qualifier\n2004 National Qualifier\n2005 National Qualifier\n2007 National Qualifier\n2009 National Qualifier\n2010 National Qualifier\n2014 National Qualifier", "copyright_notice": "Not specified", "rights_status": "Not assessed", "attribution_note": "Source and credit information preserved from the uploaded file.", "source_file": "Therac 25 - DI.pdf", "source_pages": 8, "introduction_text": "Cancer blossoms like a fleur du mal in the human body. That's a scary fact of life. Less certain -- and far more delicate -- is the love that flowers in a hospital cancer ward in Therac 25. Alan and Moira, the most unlikely of partners. From that first mutual look of interest as they wait for their ongoing therapies, they're a couple destined to alternate between tentative offers of comfort and spiky retreat. Therac 25 by Adam Pettle", "performance_text": "A waiting room, the Princess Margaret Hospital. Early in the morning. Alan (22) sits in the waiting room. He has a black, bound journal in his lap; he is trying to write. After a beat or two, Moira enters the waiting room. She grabs a Reader’s Digest and sits down in a chair, feigning interest in the magazine. There is a long silence . . .\n\nALAN: What year is it?\n\nMOIRA: What?\n\nALAN: The Digest\n\nMOIRA: Oh. (checking the cover) Eighty-four.\n\nALAN: A fine year. The Summer Games in L.A., the arrival of E.T . . . Christ! That’s ten years ago already . . . . Now why would they want us to read articles from ten years ago? We’re cancer patients, not historians . . . . I’m Alan\n\nMOIRA: Moira\n\nALAN: So, where’s your . . . ?\n\nMOIRA: On my mind.\n\nALAN: And what number treatment is this?\n\nMOIRA: Nine.\n\nALAN: Of?\n\nMOIRA: Twenty-five.\n\nALAN: Hey! Me too. I’ve got two today.\n\nMOIRA: Yum. . . . Are you trying to pick me up?\n\nALAN: What?! No, I mean, no! Christ, I’ve never even tried in a bar, I mean I just never know what to say, and in a waiting room at the Princess Margaret I think I’d really be out of my league. (Grabbing his journal) That could be my book: “One Hundred and One Lines to Pick Up a Cancer Patient” (He begins writing the idea down in his journal) (Pause)\n\nMOIRA: “Hey, baby! Want to go for some platinum injections?”\n\nALAN: (Laughing) “You know, ah, I don’t want to brag, but I’ve got the lowest white blood cell count in this place.”\n\nMOIRA: “I don’t know if anyone has ever told you this, but you’ve got the most scannable skull I have ever . . . “ (OVER THE INTERCOM) Mr. Feldman to Vault Forty-one. Mr. Feldman.\n\nALAN: That’s me. (Getting his stuff together) What are you doing this afternoon?\n\nMOIRA: I have chemo at eleven-thirty.\n\nALAN: You’re doing both! Mon Dieu.\n\nMOIRA: Just for another week. Then my cycle is over.\n\nALAN: Well do you have plans after chemo? Another one for the book.\n\nMOIRA: Vomiting\n\nALAN: Can I join you?\n\nMOIRA: You are trying to pick me up.\n\nALAN: I’m just . . . It’s just that I have eight hours in between my two treatment . . . If I go home, I’ll fall asleep in front of Geraldo, if I stay down here, I’ll wander from coffee shop to coffee shop. We could go for coffee in the four-star cafeteria.\n\nMOIRA: Why would you want to go out with me? I’m . . . I’m bald.\n\nALAN: I’m Jewish.\n\nMOIRA: Imagine what our kids would look like.\n\nALAN: My grandfather. What do you say?\n\nMOIRA: I’ll meet you in the caf at twelve-thirty.\n\nALAN: Great! Have a good . . . Do you say “Have a good chemo?”\n\nMOIRA: No.\n\n(Alan walks out of the room, Moira closes her eyes and puts her face in her hands. Alan re-enters the room.)\n\nALAN: Did you say twel . . . ?\n\nMOIRA: What?\n\nALAN: Sorry, I . . . Are you . . . How are you feeling?\n\nMOIRA: Don’t say that.\n\nALAN: I know – the world’s worst question and yet I ask it; it’s just –\n\nMOIRA: No! It’s not a joke. If you want to know me, you can never ask me that, it’s a rule, you understand?\n\nALAN: Yes. (Pause) Do you still want to meet me for coffee?\n\nMOIRA: Maybe I’ll be there and maybe I won’t.\n\n(SCENE)\n\n(Alan sits in the cafeteria drinking a tea, anxiously looking to the door. After a few beats Moira enters the cafeteria and approaches Alan’s table, gingerly)\n\nALAN: You came.\n\nMOIRA: I decided to forgive you.\n\nALAN: Thanks. How was . . . ?\n\nMOIRA: Don’t ask. (She takes a pill out of her bad and washes it down with her bottled water.) So when was your diagnosis?\n\nALAN: Late August.\n\nMOIRA: And what was . . . ?\n\nALAN: Oh, ah . . . a tumor on my thyroid gland which was removed two weeks later, along with eleven cancerous lymph nodes and the nerve attached to my left vocal cord. The tumor was wrapped around the nerve, which was a surprise to me and to Dr Brierly. He spent an hour during my surgery deciding whether to remove the nerve or –\n\nMOIRA: Will you excuse me for a second? (Before the question is answered, she is up and out)\n\nALAN: (To himself) I think she’s gone to throw up. Is it the chemo, or the smell of the meatloaf? Or me? I wish I could . . . Maybe she wants me to go out there. I can’t. Christ, you know most people pick an early move and a bit afterwards for their first date . . . We are not most people.\n\nMOIRA: (Re-entering the cafeteria) Sorry. What were you saying? We were talking about your surgery.\n\nALAN: Right. Ah, gone: thyroid, parathyroid, eleven lymph nodes – enough for a soccer team – the nerve attached to vocal cord, gained a . . . a new pair of eyes. You know, I was hopein they would do something about this nose, but . . . not enough OR time, I guess. Cutbacks, you know? Did you have surgery?\n\nMOIRA: No. It’s inoperable. Like your nose. I have a high-grade pineal tumor that resembles meduloblastoma.\n\nALAN: (Pause) So, what do you want to be when you grow up?\n\nMOIRA: Alive.\n\nALAN: I . . . I hear there’s good money in that.\n\nMOIRA: I was in my third year of Sociology. I was thinking about social work.\n\nALAN: You are thinking about social work.\n\nMOIRA: Whatever. Chris . . . my boyfriend . . . is coming to get me at one-thirty. Do you need a lift somewhere?\n\nALAN: Oh, no thanks, I’ve got my car.\n\nMOIRA: Ooooh, he’s got a car.\n\nALAN: Yeah, she’s a ’79 Gremlin. It was my high school graduation present.\n\nMOIRA: A Gremlin?\n\nALAN: Yeah, well, I didn’t do that well in high school. Do you drive?\n\nMOIRA: I do, but not lately. I mean, you know what they say about morphine and driving.\n\nALAN: Well, you should give me your number. I mean, I’m coming down here every day, I’d be happy to give you a life if you – (She starts writing her phone number down and laughing.) What?\n\nMOIRA: I was just thinking . . . I wonder what’s more distasteful: the chemo, or being driven to it in a Gremlin.\n\nALAN: Eh! Enough with the car. Here, I’m going to give you mine, too. (He writes down his number, starts to hand it to her, then pulls it back.) Now no crank calls, OK?\n\nMOIRA: I promise\n\n(SCENE)\n\n(A small Greet Orthodox church beside the hospital)\n\nMOIRA: Thanks for bringing me here. I haven’t been in a church in three years.\n\nALAN: Happy halfway home. Treatment number thirteen, c’est finis!\n\nMOIRA: Why do you do that? . . . That French thing at the end of your sentences. If we were married that would be one of those things that would secretly drive me crazy and eventually force me into an adulterous affair.\n\nALAN: C’est dommage! I think the way that you stare at my hairline when I’m speaking would have me banging the maid long before you had a chance to .\n\nMOIRA: Banging the maid? Is that what sex is with you? Banging?\n\nALAN: Do you think this is the place to be discussing this?\n\nMOIRA: No. (Pause) If you’d said I would be nailing the maid, then we’d\n\nALAN: Oh. Nice. Crucifixion jokes, we are in big trouble.\n\nMOIRA: Oh, you’re right, I shouldn’t mock God, make . . . make jokes about Jesus, I should be grateful for all this great luck I’ve been having . . . I’m sorry, God, please don’t give me locusts or . . . or a brain tumor, or . . .\n\nALAN: Moira, please –\n\nMOIRA: Excuse me! I’m talking to God. And when I die, please take care of mommy and daddy and my dog Suzie . . .\n\nALAN: Do you ever wonder why everyone cries when they’re born? I men, not everyone cries when they die, right? At least not on TV.\n\nMOIRA: No, they don’t. I think you’re on to something Nietzsche.\n\nALAN: I’m not talking about dying tomorrow, it’s a long way off, for both of us, but it is inevitable, and . . . and I think we could talk about it.\n\nMOIRA: I don’t want to talk about it. . . Your top three.\n\nALAN: What?\n\nMOIRA: Your top three biggest regrets if you die tomorrow, not that it’s going to happen. What are the chances of your cancer recurring, what?! Seventy-five percent it won’t.\n\nALAN: Yes! And you’ve got a good chance, too. I looked up meduloblastoma, it’s treatable! You’ve got a really good shot at beating this thing!\n\nMOIRA: I think I’m going to throw up. . . No I am going to throw up. (Moira begins to sing Moonshadow to herself. After a beat or two, she begins to vomit)\n\nALAN: Ah . . . is there anything I can do for you?\n\nMOIRA: Sing Moonshadow . . . Cat Stevens, Moonshadow, sing it.\n\nALAN: Moira, I . . . I . . . I don’t know it. (Moira puts her hand on Alan’s back; Alan moves away) No, I can’t\n\nMOIRA: Can’t want?\n\nALAN: Be touched. I’m sorry I . . . I tried to tell you. It’s just that since September, since my surgery, I . . . I have days when I can’t be touched, not by hands, not by drugs, not even a hug from my mother. And I need you to know that it’s not your hands that are making me nauseous, it’s this body . . . How am I supposed to have a relationship? How am I supposed to explain why I’m crying for the ninth night in a row? . . . You know, I don’t even like it when someone holds my hand.\n\nMOIRA: I think I’d better go. (Moira begins walking out, staggering a little. Suddenly she grabs the back of her neck then falls, convulsing in a seizure.)\n\nALAN: Oh my God! (Lights fade)\n\n(SCENE)\n\n(A hospital room. Moira sits in a hospital bed hooked to an IV. She is staring out the window, Alan enters.\n\nMOIRA: I don’t want you here. I want you to leave. It’s going to be really embarrassing if I have to call Security – for both of us – so I’m asking you once more to leave.\n\nALAN: I can’t just leave things like this.\n\nMOIRA: Which part of that didn’t you understand? Go away!\n\nALAN: No – you – just let me apologize, OK, and then I’ll leave.\n\nMOIRA: Oh! I get it! You think this is your fault. This is a guilt visit. You won’t be able to live with yourself thinking you caused the seizure that broke the camel’s back.\n\nALAN: (simultaneously with “live”) That’s not what I’m saying. I just need to talk to you.\n\nMOIRA: You need to talk to me? What could there possible be to talk about? Now get out and don’t come back.\n\nALAN: “I’m being followed by a moon shadow, moon shadow, moon shadow. I’m leaping and hopping on a moon shadow, moon shadow, moon shadow . . . “ (He has some trouble remembering the words) “And if I ever lose my eyes, lose my eyes, if I lose. And if I ever lose my eyes, oh way hey hey hey hey hey hey hey hey, I won’t have to see again.”\n\nMOIRA: It’s a joke (near tears) (pause)\n\nALAN: What’s happening?\n\nMOIRA: I told you that my tumor resembled meduloblastoma, but what makes it different is that it can travel through the spinal fluid to other parts of the brain and . . . mine has.\n\nALAN: What does that mean?\n\nMOIRA: That I’m going to die.\n\nALAN: When?\n\nMOIRA: Soon.\n\nALAN: Is there anything I can do? (Moira shakes her head, but then it slowly turns into a nod. She looks at him, reaches down and touches his nose. Alan does not pull away. Moira runs her hand down his face, and then takes his hand and puts it on her chest.) Moira . . . how are you feeling?\n\nMOIRA: I’m scared.", "text_layout": "prose", "intro_boundary": "High", "teaser_present": "Yes", "speaker_labels": ["ALAN", "MOIRA"], "character_count": 2, "word_count": 1606, "intro_word_count": 77, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": [], "provenance": {"title": {"origin": "source", "evidence": "Title lines at the top of page 1"}, "author": {"origin": "source", "evidence": "Byline: By Adam Pettle"}, "publisher": {"origin": "source", "evidence": "Publisher: Scirocco Drama"}, "isbn": {"origin": "source", "evidence": "ISBN/ISSN: 978-1896239705"}, "publication_date_raw": {"origin": "source", "evidence": "Date: Sept 2000"}, "event": {"origin": "human", "evidence": "Filed by the uploader in the folder for this event"}, "performer_category_as_filed": {"origin": "human", "evidence": "Folder name in the upload"}, "source_citation": {"origin": "computed"}, "web_only_source": {"origin": "computed"}, "intro_boundary": {"origin": "computed"}, "teaser_present": {"origin": "computed"}, "word_count": {"origin": "computed"}, "intro_word_count": {"origin": "computed"}, "speaker_labels": {"origin": "computed"}, "character_count": {"origin": "computed"}, "text_layout": {"origin": "computed"}}, "selections": [], "character_bucket": "2 to 3 labelled speakers", "same_book": [], "similar_versions": []}, {"id": "IC-0041", "record_type": "Cutting", "title": "There Will Come Soft Rains", "event": "Dramatic Interpretation", "performer_category_as_filed": "Any Gender", "author": "Ray Bradbury", "work_title": "The Harper Anthology of Fiction", "publisher": "Addison-Wesley Pub Co", "isbn": "978-0673396341", "publication_date_raw": "Jan 1997", "source_url": "Not specified", "literary_form": "Not specified", "source_block_raw": "Author: Ray Bradbury\nBook: The Harper Anthology of Fiction\nISBN: 978-0673396341\nPublisher: Addison-Wesley Pub Co\nDate (Month/Year): Jan 1997", "source_notes": [], "cutter": "Not specified", "award_history_raw": "2004 National Qualifier", "copyright_notice": "Not specified", "rights_status": "Not assessed", "attribution_note": "Source and credit information preserved from the uploaded file.", "source_file": "There Will Come Soft Rains - DI.pdf", "source_pages": 8, "introduction_text": "Published in 1920, Sara Teasdale’s poem \"There Will Come Soft Rains\" envisions an idyllic post-apocalyptic world in which nature continues peacefully, beautifully, and indifferently after the extinction of humankind.\n\nBut Ray Bradbury’s future is quite different and much less peaceful. The future is now! Alexa, Siri, and Google Assistants have expanded their abilities and technology reigns supreme. Smart homes cater to our every need . . . until society destroys itself and a radioactive glow fills the skies.\n\nThere Will Come Soft Rains by Ray Bradbury", "performance_text": "There will come soft rains and the smell of the ground,\n\nAnd swallows circling with their shimmering sound;\n\nAnd frogs in the pools singing at night,\n\nAnd wild plum trees in tremulous white;\n\nRobins will wear their feathery fire,\n\nWhistling their whims on a low fence-wire;\n\nAnd not one will know of the war, not one\n\nWill care at last when it is done,\n\nNot one would mind, neither bird nor tree,\n\nIf mankind perished utterly;\n\nAnd Spring herself, when she woke at dawn\n\nWould scarcely know that we were gone.\n\nIn the living room the voice-clock sang, Tick-tock, seven o'clock, time to get up, time to get up, seven o'clock! as if it were afraid that nobody would. The morning house lay empty. The clock ticked on, repeating and repeating its sounds into the emptiness. Seven-nine, breakfast time, seven-nine!\n\nIn the kitchen the breakfast stove gave a hissing sigh and ejected from its warm interior eight pieces of perfectly browned toast, eight eggs sunny side up, sixteen slices of bacon, two coffees and two cool glasses of milk.\n\n\"Today is August 4, 2026,\" said a second voice from the kitchen ceiling, \"in the city of Allendale, California.\" It repeated the date three times for memory's sake. \"Today is Mr. Featherstone's birthday. Today is the anniversary of Tilita's marriage. Insurance is payable, as are the water, gas, and light bills.\"\n\nSomewhere in the walls, relays clicked, memory tapes glided under electric eyes.\n\nEight-one, tick-tock, eight-one o'clock, off to school, off to work, run, run, eight-one! But no doors slammed, no carpets took the soft thread of rubber heels. It was raining outside. The weather box on the front door sang quietly: \"Rain, rain, go away; rubbers, raincoats for today…\" And the rain tapped on the empty house, echoing.\n\nOutside, the garage chimed and lifted its door to reveal the waiting car. After a long wait the door swung down again.\n\nAt eight-thirty the eggs shriveled and the toast was like stone. An aluminum wedge scraped them into the sink, where hot water whirled them down a metal throat which digested and flushed them away to the distant sea. The dirty dishes were dropped into a hot washer and emerged twinkling dry.\n\nNine-fifteen, sang the clock, time to clean.\n\nOut of warrens in the wall, tiny robot mice darted. The rooms were a crawl with the small cleaning animals, all rubber and metal. They thudded against chairs, whirling their mustached runners, kneading the rug nap, sucking gently at hidden dust. Then, like mysterious invaders, they popped into their burrows. Their pink electric eyes faded. The house was clean.\n\nTen o'clock. The sun came out from behind the rain. The house stood alone in a city of rubble and ashes. This was the one house left standing. At night the ruined city gave off a radioactive glow which could be seen for miles.\n\nTen-fifteen. The garden sprinklers whirled up in golden founts, filling the soft morning air with scatterings of brightness. The water pelted windowpanes, running down the charred west side where the house had been burned, evenly free of its white paint. The entire west face of the house was black, save for five places. Here the silhouette in paint of a man mowing a lawn. Here, as in a photograph, a woman bent to pick up flowers. Still farther over, their images burned on wood in one titanic instant, a small boy, hands flung into the air; higher up, the image of a thrown ball, and opposite him, a girl, hands raised to catch a ball which never came down.\n\nThe five spots of paint—the man, the woman, the children, the ball—remained. The rest was a thin charcoaled layer.\n\nThe gentle sprinkler rain filled the garden with falling light.\n\nUntil this day, how well the house had kept its peace. How carefully it had inquired, \"Who goes there? What's the password?\" and, getting no answer from lonely foxes and whining cats, it had shut up its windows and drawn shades in an old-maidenly preoccupation with self—protection which bordered on mechanical paranoia.\n\nIt quivered at each sound, the house did. If a sparrow brushed a window the shade snapped up. The bird, startled, flew off! No, not even a bird must touch the house! The house was an altar with ten thousand attendants, big, small, servicing attending, in choirs. But the gods had gone away, and the ritual of the religion continued senselessly, uselessly.\n\nTwelve noon.\n\nA dog whined, shivering, on the front porch.\n\nThe front door recognized the dog voice and opened. The dog, once huge and fleshy, but now gone to bone and covered with sores, moved in and though the house, tracking mud. Behind it whirred angry mice, angry at having to pick up mud, angry at inconvenience.\n\nFor not a leaf fragment blew under the door but what the wall flipped open and the copper scrap rats flashed swiftly out. The offending dust, hair, or paper, seized in miniature steel jaws, was raced back to the burrow. There, down the tubes which fed into the cellar, it was dropped into the sighing vent of an incinerator which sat like evil Baal in a dark corner.\n\nThe dog ran upstairs, hysterically yelping to each door, at least realizing, as the house realized, that only silence was there.\n\nIt sniffed the air and scratched the kitchen door. Behind the door the stove was making pancakes which filled the house with a rich baked odor and the scent of maple syrup.\n\nThe dog frothed at the mouth, lying at the door, sniffing, its eyes turned to fire. It ran wildly in circles, biting at its tail, spun in a frenzy, and died. It lay in the parlor for an hour.\n\nTwo o'clock, sang a voice.\n\nDelicately sensing decay at last, the regiments of mice hummed out as softly as blown gray leaves in an electrical wind.\n\nTwo-fifteen.\n\nThe dog was gone.\n\nIn the cellar, the incinerator glowed suddenly and a whirl of sparks leaped up the chimney.\n\nTwo thirty-five.\n\nBridge tables sprouted from patio walls. Playing cards fluttered onto pads in a shower of pips. Martinis manifested on an oaken bench with egg-salad sandwiches. Music played.\n\nBut the tables were silent and the cards untouched.\n\nAt four o'clock the tables folded like butterflies back though the paneled walls.\n\nFour-thirty.\n\nThe nursery walls glowed.\n\nAnimals took shape: yellow giraffes, blue lions, pink antelopes, lilac panthers cavorting in crystal substance. The walls were glass. They looked upon color and fantasy. Hidden fills clocked though well-oiled sprockets, and the walls lived. The nursery floor was woven to resemble a crisp, cereal meadow. Over this ran aluminum roaches and iron crickets, and in the hot still air butterflies of delicate red tissue wavered among the sharp aroma of animal spoors! There was the sound like a great matted yellow hive of bees within a dark bellows, the lazy bumble of a purring lion. And there was the patter of okapi feet and the murmur of a fresh jungle rain, like other hoofs, falling upon the summer-starched grass. Now the walls dissolved into distances of parched weed, mile on mile, and the warm endless sky. The animals drew away into thorn brakes and water holes. It was the children's hour.\n\nFive o'clock. The bath filled with clear hot water.\n\nSix, seven, eight o'clock. The dinner dishes manipulated like magic tricks, and in the study a click. In the metal stand opposite the hearth where a fire now blazed up warmly, a cigar popped out, half an inch of soft gray ash on it, smoking, waiting.\n\nNine o'clock. The beds warmed their hidden circuits, for nights were cool here.\n\nNine-five. A voice spoke from the study ceiling: \"Mrs. McClellan, which poem would you like this evening?\" The house was silent.\n\nThe voice said at last, \"Since you express no preference, I shall select a poem at random.\" Quiet music rose to back the voice. \"Sara Teasdale. As I recall, your favorite…\"\n\nThere will come soft rains and the smell of the ground,\n\nAnd swallows circling with their shimmering sound;\n\nAnd frogs in the pools singing at night,\n\nAnd wild plum trees in tremulous white;\n\nRobins will wear their feathery fire,\n\nWhistling their whims on a low fence-wire;\n\nAnd not one will know of the war, not one\n\nWill care at last when it is done,\n\nNot one would mind, neither bird nor tree,\n\nIf mankind perished utterly;\n\nAnd Spring herself, when she woke at dawn\n\nWould scarcely know that we were gone.\n\nThe fire burned on the stone hearth and the cigar fell away into a mound of quiet ash in its tray. The empty chairs faced each other between the silent walls, and the music played.\n\nAt ten o'clock the house began to die.\n\nThe wind blew. A falling tree bough crashed through the kitchen window. Cleaning solvent, bottled, shattered over the stove. The room was ablaze in an instant!\n\n\"Fire!\" screamed a voice. The house lights flashed, water pumps shot water from the ceilings. But the solvent spread on the linoleum, licking, eating, under the kitchen door., while the voices took it up in chorus: \"Fire, fire, fire!\"\n\nThe house tried to save itself. Doors sprang tightly shut, but the windows were broken by the heat and the wind blew and sucked upon the fire.\n\nThe house gave ground as the fire in ten billion angry sparks moved with flaming ease from room to room and then up the stairs. While scurrying water rats squeaked from the walls, pistoled their water, and ran for more. And the wall sprays let down showers of mechanical rain.\n\nBut too late. Somewhere, sighing, a pump shrugged to a stop. The quenching rain ceased. The reserve water supply which had filled baths and washed dishes for many quiet days was gone.\n\nThe fire crackled up the stairs. It fed upon Picassos and Matisses in the upper halls like delicacies, baking off the oily flesh, tenderly crisping the canvases into black shavings.\n\nNow the fire lay in bed, stood in windows, changed the colors of drapes!\n\nAnd then, reinforcements. From attic trapdoors, blind robot faces peered down with faucet mouths gushing green chemical.\n\nThe fire backed off, as even an elephant must at the sight of a dead snake.\n\nNow there were twenty snakes whipping over the floor, killing the fire with a clear cold venom of green froth.\n\nBut the fire was clever. It had sent flame outside the house, up through the attic to the pumps there. An explosion! The attic brain which directed the pumps was shattered into bronze shrapnel on the beams.\n\nThe fire rushed back into every closet and felt of the clothes hung there.\n\nThe house shuddered, oak bone on bone, its bared skeleton cringing from the heat, its wire, its nerves revealed as if a surgeon had torn the skin off to let the red veins and capillaries quiver in the scalded air. Help, help! Fire! Run, run! Heat snapped mirrors like the first brittle winter ice. And the voices wailed. Fire, fire, run, run, like a tragic nursery rhyme, a dozen voices, high, low, like children dying in a forest alone, alone. And the voices fading as the wires popped their sheathings like hot chestnuts. One, two, three, four, five voices died.\n\nIn the nursery the jungle burned. Blue lions roared, purple giraffes bounded off. The panthers ran in circles, changing color, and ten million animals, running before the fire, vanished off toward a distant steaming river . . . Ten more voices died.\n\nIn the last instant under the fire avalanche, other choruses, oblivious, could be heard announcing the time, cutting the lawn by remote-control mower, or setting an umbrella frantically out and in, the slamming and opening front door, a thousand things happening, like a clock shop when each clock strikes the hour insanely before or after the other, a scene of maniac confusion, yet unite; singing, screaming, a few last cleaning mice darting bravely out to carry the horrid ashes away! And one voice, with sublime disregard for the situation, read poetry aloud in the fiery study, until all the film spools burned, until all the wires withered and the circuits cracked.\n\nThe fire burst the house and let it slam flat down, puffing out skirts of spark and smoke.\n\nIn the kitchen, an instant before the rain of fire and timber, the stove could be seen making breakfasts at a psychopathic rate, ten dozen eggs, six loaves of toast, twenty dozen bacon strips, which, eaten by fire, started the stove working again, hysterically hissing!\n\nThe crash. The attic smashing into kitchen and parlour. The parlour into cellar, cellar into sub-cellar. Deep freeze, armchair, film tapes, circuits, beds, and all like skeletons thrown in a cluttered mound deep under.\n\nSmoke and silence. A great quantity of smoke.\n\nDawn showed faintly in the east. Amount the ruins, one wall stood alone. Within the wall, a last voice said, over and over gain and again, even as the sun rose to shine upon the heaped rubble and steam:\n\nToday is August 5, 2026, today is August 5, 2026, today is . . .", "text_layout": "prose", "intro_boundary": "High", "teaser_present": "Yes", "speaker_labels": [], "character_count": null, "word_count": 2223, "intro_word_count": 84, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": [], "provenance": {"title": {"origin": "source", "evidence": "Title lines at the top of page 1"}, "author": {"origin": "source", "evidence": "Byline: By Ray Bradbury"}, "work_title": {"origin": "source", "evidence": "Source block"}, "publisher": {"origin": "source", "evidence": "Publisher: Addison-Wesley Pub Co"}, "isbn": {"origin": "source", "evidence": "ISBN/ISSN: 978-0673396341"}, "publication_date_raw": {"origin": "source", "evidence": "Date: Jan 1997"}, "event": {"origin": "human", "evidence": "Filed by the uploader in the folder for this event"}, "performer_category_as_filed": {"origin": "human", "evidence": "Folder name in the upload"}, "source_citation": {"origin": "computed"}, "web_only_source": {"origin": "computed"}, "intro_boundary": {"origin": "computed"}, "teaser_present": {"origin": "computed"}, "word_count": {"origin": "computed"}, "intro_word_count": {"origin": "computed"}, "speaker_labels": {"origin": "computed"}, "character_count": {"origin": "computed"}, "text_layout": {"origin": "computed"}}, "selections": [], "character_bucket": "No speaker labels", "same_book": [], "similar_versions": []}, {"id": "IC-0042", "record_type": "Cutting", "title": "Twilight: Los Angeles, 1992", "event": "Dramatic Interpretation", "performer_category_as_filed": "Any Gender", "author": "Anna Deavere Smith", "work_title": "Not specified", "publisher": "Anchor Books", "isbn": "978-0385473767", "publication_date_raw": "March 1994", "source_url": "Not specified", "literary_form": "Not specified", "source_block_raw": "Author: Anna Deavere Smith\nISBN: 978-0385473767\nPublisher: Anchor Books\nDate (Month/Year): March 1994", "source_notes": [], "cutter": "Not specified", "award_history_raw": "2009 National Qualifier\n2014 National Qualifier\n2015 National Qualifier", "copyright_notice": "Not specified", "rights_status": "Not assessed", "attribution_note": "Source and credit information preserved from the uploaded file.", "source_file": "Twilight Los Angeles 1992 - DI.pdf", "source_pages": 8, "introduction_text": "The 1992 Los Angeles riots, also known as the Rodney King uprising or the Rodney King riots, were sparked on April 29, 1992 when a predominately white jury acquitted four police officers accused in the videotaped beating of black motorist Rodney King when he resisted arrest following a high-speed car chase. Thousands of blacks in the Los Angeles area joined in what is known as a race riot involving acts of law-breaking including looting, assault, arson and murder. In all, 53 people died during the riots. Anna Deavere Smith offers a stark insight into the complex and pressing social, economic, and political issues that fueled the flames in the wake of the Rodney King verdict by dramatizing her interviews with a racially diverse population at the scene of the riots. Travel back to me now to . . . . . Twilight: Los Angeles, 1992 by Anna Deavere Smith.", "performance_text": "Elvira Evers, General Worker and Cashier, Canteen Corporation\n\nWith a baby bottle in her hand. At her kitchen table. A black woman from Panama in her forties. Children can be heard off stage. A Panamanian accent. She has a gold front tooth.\n\nSo it was like a carnival out there\nand I say\nto my friend Frances\n\"Frances, you see this?\"\nand she said, \"Girl, you should see\nthat\nit's getting worst.\"\nAnd I say, \"Girl, let me take my butt\nup there before something happen.\"\nAnd, um,\nwhen somebody throw a bottle\nand I just. . .\nthen I felt\nlike moist,\nand it was like a tingling sensation, right?\nAnd I didn't like this,\nand it was like itchin',\nand I say, \"Frances, I'm bleedin'.\"\nAnd she walk with me to her house.\nAnd she say, \"Lift up your gown, let me see.\"\nShe say, \"Elvira, it's a bullet!\"\nI say, \"What?\"\n\nI say, \"I didn't heard nothin'.\"\nShe say, \"Yes, but it's a bullet.\"\nShe say, \"Lay down there. Let me call St. Francis and tell them that you been shot\nand to send an ambulance.\"\nAnd she say,\n\"Why you?\nYou don't mess with none of those people.\nWhy they have to shoot you?\"\nSo Frances say the ambulance be here in fifteen minutes.\nI say, \"Frances,\nI cannot wait that.\"\nI say,\n\"I'm goin'!\"\nSo I told my oldest son, I say,\n\"Amant, take care your brothers.\nI be right back.\"\nWell, by this time he was standing there, he was crying,\nall of them was crying.\nWhat I did for them not to see the blood\nI took the gown and I cover it\nand I didn't cry.\nThat way they didn't get nervous.\nAnd I get in the car.\nI was goin' to drive.\nFrances say, \"What you doin'?\"\nI said, \"I'm drivin'.\"\nShe say, \"No, you're not!\"\nAnd we take all the back streets,\nand she was so supportive,\nbecause she say, \"You all right?\nYou feel cold?\nYou feel dizzy?\nThe baby move?\"\nShe say, \"You nervous?\"\nI say, \"No, I'm not nervous, I'm just worried about the baby.\"\nI say, \"I don't want to lose this baby.\"\nShe say, \"Elvira, everything will be all right.\" She say, \"Just pray.\" So there was a lot of\ncars, we had to be blowing the horn.\nSo finally we get to St. Francis\nand Frances told the front-desk office, she say,\n\"She been shot!\"\nAnd they say, \"What she doin' walkin'?\"\nAnd I say, \"I feel all right.\"\nEverybody stop doin' what they was doin'\nand they took me to the room\nand put the monitor to see if the baby was fine\nand they find the baby heartbeat,\nand as long as I heard the baby heartbeat I calmed down,\nlong as I knew whoever it is, boy or girl, it's all right,\nand\nmatter of fact, my doctor, Thomas, he was there\nat\nthe emergency room.\nWhat a coincidence, right?\nI was just lookin' for that familiar face,\nand soon as I saw him\nI say, \"Well, I'm all right now.\"\nRight?\nSo he bring me this other doctor and then told me,\n\"Elvira, we don't know how deep is the bullet.\nWe don't know where it went. We gonna operate on\nyou.\nBut since that we gonna operate we gonna take the baby out\nand you don't have to\ngo through all of that.\"\nThey say, \"Do you understand\nwhat we're saying?\"\nI say, \"Yeah!\"\nAnd they say, \"Okay, sign here.\"\nAnd I remember them preparing me\nand I don't remember anything else.\nNella!\nNo.\n\n(Turns to the side and admonishes the child)\nShe likes company.\nAnd in the background\nI remember Dr. Thomas say, \"You have a six-pound-twelve-ounce little girl. \"\nHe told me how much she weigh and her length\nand he\nsay, \"Um,\nshe born,\nshe had the bullet in her elbow,\nbut when we remove. . .\nwhen we dean her up\nwe find out that the bullet was still between two joints,\nso we did operate on her and your daughter is fine\nand you are fine.\"\n\n(Sound of a little child saying \"Mommy\")\nNella!\nShe wants to show the baby\nJessica.\nBring the baby.\n\n(She laughs) Yes, yes.\n\nWe don't like to keep the girls without earrings, we like the little girls\nto look like girls from little.\nI pierce hers.\nWhen I get out on Monday,\nby Wednesday I did it,\nso by Monday she was five days,\nshe was seven days,\nand I\npierced her ears,\nand the red band is just like for evil eyes.\nWe really believe in Panama. . .\nin English I can't explain too well.\nAnd her doctor, he told,\nhe explain to me\nthat the bullet\ndestroyed the placenta\nand\nwent through me\nand she caught in her arms.\n\n(Here you can hear the baby making noise, and a bell rings) If she didn't caught it in her\narm,\nme and her would be dead.\nSee?\nSo it's like\nopen your eyes,\nwatch what is goin' on.\n\nMrs. Young-Soon Han, Former Liquor Store Owner (Korean)\n\nWhen I was in Korea\nI used to watch many luxurious, Hollywood-lifestyle movies; I never saw any poor men,\nany black,\nmaybe one housemaid.\nUntil last year\nI believed America is the best.\nI still believe it.\nI don't deny that now\nbecause I'm victim,\nbut\nas\nthe year ends in '92\nand we were still in turmoil\nand having all the financial problems\nand mental problems.\nThen a couple months ago\nI really realized that\nKorean immigrants were left out\nfrom this\nsociety and we were nothing.\nWhat is our right?\nIs it because we are Korean?\nIs it because we have no politicians?\nIs it because we don't\nspeak good English?\nWhy?\nWhy do we have to be left out?\n\n(She is hitting her hand on the coffee table) We are not qualified to have medical treatment. We are not qualified to get, uh, food stamps\n\n(She hits the table once) not GR\n\n(Hits the table once) no welfare.\n\n(Hits the table once) Anything. Many Afro-Americans\n\n(Two quick hits)\nwho never worked,\n(One hit)\nthey get\nat least minimum amount\n\n(One hit) of money\n\n(One hit) to survive.\n\n(One hit) We don't get any.\n\n(Large hit with full hand spread) Because we have a car\n\n(One hit) and we have a house.\n\n(pause six seconds)\nAnd we are high taxpayers. (One hit. Pause fourteen seconds) Where do I finda [sic]\njustice?\nOkay, black people\nprobably\nbelieve they won\nby the trial?\nEven some complains only half right.\nJustice was there.\nBut I watched the television\nthat Sunday morning,\nearly morning as they started.\nI started watch it all day.\n\nThey were having party and then they celebrated,\nall of South Central,\nall the churches.\nThey finally found that justice exists\nin this sodety.\nThen where is the victims' rights?\nThey got their rights\nby destroying innocent Korean merchants.\nThey have a lot of respect,\nas I do,\nfor\nDr. Martin King?\nHe is the only model for black community.\nI don't care Jesse Jackson.\nBut\nhe was the model\nof nonviolence.\nNonviolence?\nThey like to have hiseh [sic] spirits.\nWhat about last year?\nThey destroyed innocent people.\n\n(pause five seconds) And I wonder if that is really justice\n\n(And a very soft\" ah\" after \"justice,\" like \"justiceah,\" but very quick) to get their rights in this way.\n\n(pause thirteen seconds)\nI waseh swallowing the bitternesseh,\nsitting here alone and watching them.\nThey became all hilarious\n\n(pause three seconds)\nand, uh,\nin a way, I was happy for them\nand I felt glad for them.\nAt least they got something back, you know.\nJust let's forget Korean victims or other victims\nwho are destroyed by them.\nThey have fought\nfor their rights\n\n(One hit simultaneous with the word \"rights\") over two centuries\n\n(One hit simultaneous with\" centuries\")\nand I have a lot of sympathy and understanding for them. Because of their effort and\nsacrificing,\nother minorities, like Hispanic\nor Asians,\nmaybe we have to suffer more\nby mainstream,\nyou know.\nThat's why I understand,\nand then\nI like to be part of their\n'joyment.\nBut.. .\nthat's why I had mixed feeling\nas soon as I heard the verdict.\nI wish I could\nlive together\nwith eh [sic] blacks,\nbut after the riots\nthere were too much differences.\nThe fire is still there\nhow do you call it?\nigni. . .\nigniting fire.\n\n(She says a Korean word, \"Dashi yun gi ga nuh\") It canuh burst out anytime.\n\nTwilight Bey, Organizer of Gang Truce\n\nSo a lot of times when I've brought up ideas to my homeboys, they say, \"Twilight,\nthat's before your time,\nthat's something you can't do now.\"\nWhen I talked about the truce back in 1988,\nthat was something they considered before its time,\nyet in 1992\nwe made it\nrealistic.\nSo to me it's like I'm stuck in limbo,\nlike the sun is stuck between night and day\nin the twilight hours.\nYou know,\nI'm in an area not many people exist.\nNighttime to me\nis like a lack of sun,\nand I won't affiliate\ndarkness with anything negative.\nI affiliate\ndarkness with what was first,\nbecause it was first,\nand then relative to my complexion.\nI am a dark individual,\nand with me stuck in limbo,\nI see darkness as myself.\nI see the light as knowledge and the wisdom of the world and\n\nunderstanding others,\nand in order for me to be a, to be a true human being,\nI can't forever dwell in darkness,\nI can't forever dwell in the idea,\njust identifying with people like me and understanding me and mine. So twilight\nis\nthat time\nbetween day and night,\nlimbo;\nI call it limbo.", "text_layout": "verse", "intro_boundary": "High", "teaser_present": "No", "speaker_labels": [], "character_count": null, "word_count": 1518, "intro_word_count": 146, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": [], "provenance": {"title": {"origin": "source", "evidence": "Title lines at the top of page 1"}, "author": {"origin": "source", "evidence": "Byline: By Anna Deavere Smith"}, "publisher": {"origin": "source", "evidence": "Publisher: Anchor Books"}, "isbn": {"origin": "source", "evidence": "ISBN/ISSN: 978-0385473767"}, "publication_date_raw": {"origin": "source", "evidence": "Date: March 1994"}, "event": {"origin": "human", "evidence": "Filed by the uploader in the folder for this event"}, "performer_category_as_filed": {"origin": "human", "evidence": "Folder name in the upload"}, "source_citation": {"origin": "computed"}, "web_only_source": {"origin": "computed"}, "intro_boundary": {"origin": "computed"}, "teaser_present": {"origin": "computed"}, "word_count": {"origin": "computed"}, "intro_word_count": {"origin": "computed"}, "speaker_labels": {"origin": "computed"}, "character_count": {"origin": "computed"}, "text_layout": {"origin": "computed"}}, "selections": [], "character_bucket": "No speaker labels", "same_book": [], "similar_versions": []}, {"id": "IC-0043", "record_type": "Cutting", "title": "A Week in the Life of Death", "event": "Dramatic Interpretation", "performer_category_as_filed": "Any Gender", "author": "David Gavin", "work_title": "Living Easter through the Year", "publisher": "Liturgical Press", "isbn": "0814631525", "publication_date_raw": "2005", "source_url": "Not specified", "literary_form": "Not specified", "source_block_raw": "Author: David Gavin\nBook: Living Easter through the Year\nISBN: 0814631525\nPublisher: Liturgical Press\nDate(Month/Year): 2005", "source_notes": [], "cutter": "Not specified", "award_history_raw": "2007 National Qualifier – DI - ALL", "copyright_notice": "Not specified", "rights_status": "Not assessed", "attribution_note": "Source and credit information preserved from the uploaded file.", "source_file": "Week in the Life of Death - DI.pdf", "source_pages": 5, "introduction_text": "Who on earth was this Jesus of Nazareth, then? How come we make such world-shattering claims about him? A Week in the Life of Death by David Gavin", "performance_text": "Monday. Dear Diary: It’s me again - Death. The big D. What a day! Busy, busy, busy. Bit like yesterday. And the day before. And the day before that. Tragic cases really. Some so beautiful. Some so young. Oh, I nearly wept, you know – but in the end I didn’t bother. Well, must finish. Busy evening ahead.\n\nTuesday. Dear Diary: I suppose you think it’s a bit soft, Death writing a diary. But I don’t really get to stop and meet anyone to chat. Oh, I meet people. I meet everyone. Met them all, the great philosophers, the great religious leaders. Great wits, great thinkers. (Great twits, great stinkers.) But it’s all so brief and to the point. Always. ALWAYS!\n\nWednesday. Dear Diary: Two big battles fought today. One in, oh – Er, thingamy and another in, Wherever-it-is. Now myself, I prefer famines and plagues – then you get a good steady business over a period. Battles – well, you’re rushed off your feet! D’you know, diary. I can’t understand these people. They spend half their time scared stiff of me and trying to avoid me, and then they have a battle! Tuh!\n\nThursday. Dear Diary: Death. The final frontier where Captain James T. Kirk must boldly go! I’m pretty impressive really, don’t you think? It’s the ultimate statistic, you know: one in one die. … Yes, I like that – the ultimate. THE ULTIMATE.\n\nFriday. Dear Diary: The ultimate here. Interesting day today. A carpenter’s son from Nazareth. Been a lot of fuss about him. Died well (Thoughtful – then snaps out of it) if you can die well! A bit like saying, ‘I failed well’. A bit like saying, ‘I swallow dived off a 100 foot cliff into the yawning mouth of a great white shark and got full marks for style’. Huh!\n\nSaturday. Dear Diary (Slower): Funny feeling today. Like when you’ve eaten something that doesn’t agree with you. Still, death must go on! Yes, that’s a much more sensible saying: ‘Life must go on’ – that’s drivel! Not in my experience. Life must – life must grovel! (Pause) But I do feel strange.\n\nSunday - Easter Sunday – AD 30. (As if sick) : Dear Diary: (Looks straight ahead shocked and as if swearing) JESUS CHRIST! Death of death, and Hell’s destruction!\n\nAt first sight, he was no more than a wandering preacher – perhaps a prophet like the prophets of old; calling people to take God more seriously than they’d been used to; gathering a little band of followers – but nobody to be taken very seriously, certainly no threat to the authorities.\n\nBut then, some odd stories started circulating. Healing people. Healing them even on the Sabbath – when the religious leaders told everyone that doing things like that on the Sabbath wasn’t allowed for human beings. Why, even God himself had rested on the seventh day! And then he started telling people that their sins were forgiven. Who did he think he was? Surely he knew that only God could forgive sins?\n\nNo wonder his little band of followers started asking who he was. Who he really was, that is. He must be someone very special.\n\nThere was a moment of insight once, early in the morning on the top of a mountain, when three of them had an unearthly experience and seen him enveloped in a superhuman glory. After that, they really did begin to think that something was afoot.\n\nBut then, it had begun to go wrong.\n\nHe came into Jerusalem at the head of a demonstration. He challenged the Temple authorities and trashed their money-tables. And that really did start the opposition going. At supper on the Thursday evening, he talked about spilling his blood, but being remembered for ever because of it. That night, one of his own group led the police to where he was, and it was clear that the net was tightening round him.\n\nThe disciples began to think that, after all, they had been fooled. Peter may have seen the glory on the Mount of the Transfiguration, but in the courtyard that Thursday night he lost his nerve completely, and swore he had never known the man from Nazareth.\n\nAnd the Temple authorities knew all along that they had a trouble-maker to get rid of, or else there might be a riot.\n\nThey didn’t recognize who he was. As he was being killed, Jesus was heard to pray for his executioners - ‘Father, forgive them; they don’t know what they’re doing.’ As St Paul was to say a few years later, the rulers of this present world didn’t know the hidden wisdom of God. If they had, they wouldn’t have crucified the Lord of Glory. The disciples didn’t know, either, or they wouldn’t have scattered. And Thomas certainly didn’t know, or he’d have believed the others when they told him what they’d seen on the first Easter evening.\n\nIt took a long time for the message of Easter to strike home. For forty days the disciples were huddled together, waiting for the tap on the door that’d tell them they were under arrest, like Jesus’d been under arrest. They needed to be visited by the risen Jesus – not once, not twice, but many times – before the implications of what’d happened were obvious enough for them to go out onto the streets and tell everyone about it.\n\nBut in the end they were convinced; so convinced, that nothing could stop them. It was true that Jesus was the death of death and hell’s destruction. His death on the Cross wasn’t the end of everything, but the beginning. When he’d said that the bread and the wine were his body and his blood, he meant that his life would go on for ever, and those who ate the bread and drank the wine in remembrance of him would be part of that life for ever.\n\n‘I am convinced’, said St Paul, ‘that nothing can separate us from the love of God – not death, nor life, nor things present nor things to come, nor height nor depth nor anything else in all creation.’ Death cannot separate us from the love of God. Oh, yes; death still happens – and for some people, it will be harder than for others. The Resurrection of Jesus doesn’t stop us dying. But death can’t any longer separate us from the love of God. Because of the Resurrection, we know that the way to death is no longer a one-way street – Jesus has come back. And it is no longer a dead end – we go on from death to life eternal.\n\nDeath of death, and hell’s destruction.\n\nDo we recognize that? Or are we like Thomas, thinking that the Good News of the Gospel is just too good to be true? Or like Peter in the High Priest’s courtyard, ready to be embarrassed if there’s any danger of being recognized as a follower of Jesus?\n\nPray God to give you the conviction to believe that Jesus really is the death of death and hell’s destruction; pray that he may give you the courage to act on that conviction when the time comes to bear witness to the truth of the Resurrection.\n\nBecause Christ is risen! He is risen indeed! Alleluia!\n\nThanks be to God. Amen.", "text_layout": "prose", "intro_boundary": "High", "teaser_present": "Yes", "speaker_labels": [], "character_count": null, "word_count": 1187, "intro_word_count": 29, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": [], "provenance": {"title": {"origin": "source", "evidence": "Title lines at the top of page 1"}, "author": {"origin": "source", "evidence": "Byline: By David Gavin"}, "work_title": {"origin": "source", "evidence": "Source block"}, "publisher": {"origin": "source", "evidence": "Publisher: Liturgical Press"}, "isbn": {"origin": "source", "evidence": "ISBN/ISSN: 0814631525"}, "publication_date_raw": {"origin": "source", "evidence": "Date: 2005"}, "event": {"origin": "human", "evidence": "Filed by the uploader in the folder for this event"}, "performer_category_as_filed": {"origin": "human", "evidence": "Folder name in the upload"}, "source_citation": {"origin": "computed"}, "web_only_source": {"origin": "computed"}, "intro_boundary": {"origin": "computed"}, "teaser_present": {"origin": "computed"}, "word_count": {"origin": "computed"}, "intro_word_count": {"origin": "computed"}, "speaker_labels": {"origin": "computed"}, "character_count": {"origin": "computed"}, "text_layout": {"origin": "computed"}}, "selections": [], "character_bucket": "No speaker labels", "same_book": [], "similar_versions": []}, {"id": "IC-0044", "record_type": "Cutting", "title": "Widows and Children First!", "event": "Dramatic Interpretation", "performer_category_as_filed": "Any Gender", "author": "Harvey Fierstein", "work_title": "Torch Song Trilogy", "publisher": "Samuel French, Inc.", "isbn": "978-0573690105", "publication_date_raw": "Not specified", "source_url": "Not specified", "literary_form": "Not specified", "source_block_raw": "Author: Harvey Fierstein\nBook: Torch Song Trilogy\nISBN: 978-0573690105\nPublisher: Samuel French, Inc.", "source_notes": [], "cutter": "Not specified", "award_history_raw": "2004 National Qualifier\n2006 National Qualifier\n2009 National Qualifier", "copyright_notice": "Not specified", "rights_status": "Not assessed", "attribution_note": "Source and credit information preserved from the uploaded file.", "source_file": "Widows and Children First - DI.pdf", "source_pages": 9, "introduction_text": "Two things you should know:\n\n1) Arnold is the gay son of a Jewish mother who is an expert at avoiding the truth.\n\n2) He and his partner Allen had plans to adopt a son from the foster care system . . . a\n\nteen-age boy named David who social services felt would benefit from have two well-\n\nadjusted gay parents, to help him deal with his own homosexuality.\n\nUnfortunately for everyone, Allen did not live to see the adoption through. And now Arnold’s mother, still grieving the death of her own husband has arrived for a visit. The stage is set for . . . Widows and Children First! By Harvey Fierstein", "performance_text": "ARNOLD: [Coming out of kitchen and speaking to David (off-stage)] Did your teacher happen to mention how Oscar Wilde came to be imprisoned? He was in jail for being gay.\n\nMA: [Embarrassed] Arnold, I can't find the oil.\n\nARNOLD: In a minute, Ma. See, ten years earlier, the Parliament passed a law against homosexuality. And Oscar Wilde had this young lover named . .\n\nMA: Arnold, could you please give me a hand?\n\nARNOLD: Just a second. His name was Lord Alfred. Now, Lord Alfred's father found out about them and started causing scenes in public; chasin' 'em outta hotels and stuff.\n\nMA: For God's sake, Arnold. Could you change the subject?\n\nARNOLD: [Annoyed] I'll finish later. [Goes back to kitchen] I wish you wouldn't interfere like that; it's very embarrassing.\n\nMA: Excuse me, but listening to that is very embarrassing.\n\nARNOLD: I'm sorry you feel that way, but I have a responsibility to his education.\n\nMA: I am sure that the people who put him here did not have that kind of education in mind.\n\nARNOLD: The people who put him here had exactly that kind of education in mind. And I'll thank you not to interfere.\n\nMA: I am only suggesting that you should consider the huge responsibility you've taken on here.\n\nARNOLD: You think I'm unaware of it?\n\nMA: Then act like it. You should be setting an example for the boy.\n\nARNOLD: And I'm not?\n\nMA: Not when you talk like that, you're not. You've got to consider what you say to him for the remaining time. He's at an impressionable age. After all it's only for a few more months.\n\nARNOLD: What's for a few more months?\n\nMA: He's here on a nine-month program, right? And he's already been here six months, so . . .\n\nARNOLD: And what do you think happens then?\n\nMA: He leaves.\n\nARNOLD: David is here on a nine-month program, but after that, if we agree and the Bureau of Child Welfare allows, I will legally adopt David. And believe me, Ma, if I have anything to say about it, he's not leaving. [Ma tries to say something, she is angry, confused, frustrated. She throws down whatever is in her hands and sits on couch. Arnold follows and stands staring at her. Sits next to her. Pause] Is this it? We gonna sit and stare into space?\n\nMA: You want I should do a Bubble Dance? Frankly, Arnold, you've done a lot of crazy things, but this . . . ?\n\nARNOLD: Adopting David is not a crazy thing. It's a wonderful thing that I'm very proud of.\n\nMA: If you're so proud how come you were too ashamed to tell your mother? Everything else you tell me. You shove your sex-life down my throat like aspirin; every hour on the hour. But six months he's been here and not a word. Why?\n\nARNOLD: Ma . . . Y'know, you're not the easiest person in the world to talk to.\n\nMA: What did I say? Do I tell you how to run your life? You want to know why you didn't tell me about this? I'll tell you why: Because you knew it was wrong.\n\nARNOLD: That's not true.\n\nMA: No?\n\nARNOLD: No! This isn't something I decided to do overnight. We put in our application more than two years ago.\n\nMA: Who \"we\"?\n\nARNOLD: Alan and I.\n\nMA: The two of you were going to do this together? Now I've heard everything.\n\nARNOLD: That's what I love about you; you're so open minded.\n\nMA: Alright. So, Alan's not here. Why's the kid?\n\nARNOLD: Because with everything else I forgot about the application. Then, one day, the phone rang. It was the foster parent program and they had David for us. I told them what happened to Alan and they said I could probably take David anyway.\n\nMA: And you said, \"send him on over.\"\n\nARNOLD: Not at first. But then I thought it all through, called them back and said yes . . . On a trial basis.\n\nMA: I'm glad you got a money-back guarantee, but you still haven't told me why you wanted him.\n\nARNOLD: Because I was tired of widowing. Widow-ing . . . feeling sorry for myself, cursing every time I passed a couple walking hand in hand, watching Tear Jerkers on T.V. knowing they could only cheer me up. Christ, of all the things going down here, I was sure that was the one thing I wouldn't have to explain.\n\nMA: How should I know about Wida-whating? Did you ever say a word to me?\n\nARNOLD: I didn't think I had to. Christ, it's only been three years since daddy died.\n\nMA: Wait, wait, wait, wait, wait. Are you trying to compare my marriage with you and Alan? [Haughty and incensed] Your father and I were married for thirty-five years, had two children and a wonderful life together. What loss did you have? You fooled around with some boy. You have the nerve to compare that to a marriage of thirty-five years?\n\nARNOLD: You think it doesn't? Ma, I lost someone that I loved very much . . .\n\nMA: So you felt bad. Maybe you cried a little. But what would you know about what I went through? Thirty-five years I lived with that man. He got sick, I brought him to the hospital and you know what they gave me back? A paper bag with his watch, wallet and wedding ring. How could you possibly know what that felt like. It took me two months until I could sleep in our bed alone, a year to learn to say \"I\" instead of \"we.\" And you're going to tell me you were \"widowing.\" How dare you!\n\nARNOLD: You're right, Ma. How dare I. I couldn't possibly know how it feels to pack someone's clothes in plastic bags and watch the garbage pickers carry them away. Or what it feels like to forget and set his place at the table. How about the food that rots in the refrigerator because you forgot how to shop for one? How dare I? Right, Ma? How dare I?\n\nMA: [Starting over his speech and continuing until her exit] May God strike me dead! Whatever I did to my mother to deserve a child speaking to me this way. The disrespect! I only pray that one day you have a son and that he'll talk to you like this. The way you talk to me.\n\nARNOLD: [Over her speech] Listen, Ma, you had it easy. You have thirty-five years to remember, I have five. You had it easy, Ma. You lost your husband in a nice clean hospital, I lost mine out there. They killed him there on the street. Twenty-three years old laying dead on the street. Killed by a bunch of kids with baseball bats. [Ma has fled the room. Arnold continues to rant.] Children. Children taught by people like you. 'Cause everybody knows that queers don't matter! Queers don't love! And those that do deserve what they get! [He stops, catches his breath, sits down] [Long pause while Arnold composes himself] . . . . Ma, I'm sorry I lost my temper. Please come out here. We can't talk like this.\n\nMA: [In doorway] You don't want to talk, you want to fight.\n\nARNOLD: You wanna sit down?\n\nMA: [Wandering over to the couch] I'm sitting. [Warning] And don't holler at me. People say things they don't mean when they holler and you've already said quite enough.\n\nARNOLD: I won't holler. You just hit a raw nerve. We won't discuss Alan. Only David.\n\nMA: So discuss.\n\nARNOLD: Why don't you tell me what you already know, and we'll go on from there.\n\nMA: Let me think. He's an orphan . . .\n\nARNOLD: He's not an orphan. He was a battered child. They took him away from his parents. This is his third foster home. The first brought him back. The second he ran away from. So . . .\n\nMA: Arnold, darling, open your eyes. Don't you see how ridiculous this is? I've been here less than a day, already I've seen you let him miss school, hang out on the street, go out without dinner . . .\n\nARNOLD: This isn't Little Lord Fauntleroy we're talking about here. If this kid decided I was coming down too hard on him, he'd pack and take off and I'd never get him back again.\n\nMA: So you let him run wild?\n\nARNOLD: No. But I don't beat him up either. I teach him. I advise him, I try to set an example for him . . .\n\nMA: Some example. Arnold, look, you live the life you want. I don't say a word. This is what you want. But think about the boy. He told me he loves you. He sees you living like this . . . don't you think it's going to affect him?\n\nARNOLD: Ma, David is gay: the whole purpose of placing him here was for him to grow up with a positive attitude about his homosexuality.\n\nMA: That's it. [Stands] I'm finished.\n\nARNOLD: You think this is easy for me? Look; my hands are shaking. I've been like this for days knowing you'd be coming and we'd have to talk about this.\n\nMA: Because you knew I'd show you how wrong you are.\n\nARNOLD: I'm not wrong.\n\nMA: No? Tell me something: How old was your friend Alan when you met him?\n\nARNOLD: Seventeen.\n\nMA: Seventeen. Seventeen and you were doing God knows what together. Now tell me; how old is this \"son\" of yours?\n\nARNOLD: I have no intention of sleeping with him if that's what you're driving at.\n\nMA: I had no intention of having a homosexual for a son. So, look where intentions get you. Arnold, do what you want. You want to live like this? I don't care anymore. You're not going to make me sick like you did your father.\n\nARNOLD: I made my father sick?\n\nMA: No; he was thrilled to have a fairy for a son! You took a lifetime of dreams and threw them back in his face.\n\nARNOLD: What lifetime of dreams? He knew I was gay for fourteen years.\n\nMA: What? You think you walk into a room, say, \"Hi Dad, I'm queer,\" and that's that? You think that's what we brought you into the world for? Believe me, if I'd known I wouldn't have bothered. Arnold, you're my son, you're a good person, a sensitive person with a heart, like your father, and I try to love you for that and forget this. But you won't let me. You've got to throw me on the ground and rub my face in it. You haven't spoken a sentence since I got here without the word \"Gay\" in it.\n\nARNOLD: Because that's what I am. You want a part in my life? I am not going to edit out the things you don't like! There is nothing I need from anyone except love and respect. And anyone who can't give me those two things has no place in my life. [Breath] You are my mother, and I love you. I do. But if you can't respect me . . . Then you've got no business being here.\n\nMA: You want me to leave? I'm leaving. You want me to fight? I'm too tired. You want me to change? I'm too old and I can't. I can't, I can't, I can't. So you do what you have to do, and I'll do what I have to do and I hope you're satisfied. [Arnold groans] You can't put all the blame on me. It's not fair. Your “friend” Alan . . . How was I supposed to know?\n\nARNOLD: Why? You would have understood?\n\nMA: Maybe. Maybe not. You can't know for sure. But I flew up for the funeral and you never said a word.\n\nARNOLD: So you could've done what? Tell me he's better off dead?\n\nMA: Or maybe I could've comforted you. Told you what to expect. You and your \"widowing.\" [She turns to leave, stops, takes a breath. One last try.] You've got an unusual way of looking at things, Arnold Beckoff.\n\nARNOLD: Runs in the family. Ma, I miss him so much.\n\nMA: Give yourself time, Arnold. It gets better. But, Arnold, it won't ever go away. You can work longer hours, adopt a son, fight with me . . . whatever, it'll still be there. It becomes part of you, like wearing a ring or a pair of glasses. You get used to it and it's good . . . because it makes sure you don't forget. You don't want to forget him, do you? [Arnold shakes his head] So, it's good. [Pause] I guess that's what I would have said . . . if I'd known.", "text_layout": "prose", "intro_boundary": "High", "teaser_present": "No", "speaker_labels": ["ARNOLD", "MA"], "character_count": 2, "word_count": 2034, "intro_word_count": 108, "source_citation": "Complete", "web_only_source": "No", "tone": [], "content_warnings": [], "difficulty": "", "performance_demands": [], "audience_level": "Not assessed", "themes": [], "subject_matter": "", "metadata_confidence": "Low", "review_status": "Needs Review", "duplicate_status": "Unique", "human_verified": false, "date_verified": "", "date_added": "2026-09-30", "also_appears_in": [], "ingest_notes": [], "provenance": {"title": {"origin": "source", "evidence": "Title lines at the top of page 1"}, "author": {"origin": "source", "evidence": "Byline: By Harvey Fierstein"}, "work_title": {"origin": "source", "evidence": "Source block"}, "publisher": {"origin": "source", "evidence": "Publisher: Samuel French, Inc."}, "isbn": {"origin": "source", "evidence": "ISBN/ISSN: 978-0573690105"}, "event": {"origin": "human", "evidence": "Filed by the uploader in the folder for this event"}, "performer_category_as_filed": {"origin": "human", "evidence": "Folder name in the upload"}, "source_citation": {"origin": "computed"}, "web_only_source": {"origin": "computed"}, "intro_boundary": {"origin": "computed"}, "teaser_present": {"origin": "computed"}, "word_count": {"origin": "computed"}, "intro_word_count": {"origin": "computed"}, "speaker_labels": {"origin": "computed"}, "character_count": {"origin": "computed"}, "text_layout": {"origin": "computed"}}, "selections": [], "character_bucket": "2 to 3 labelled speakers", "same_book": [], "similar_versions": []}, {"id": "IC-0045", "record_type": "Cutting", "title": "Zooman and the Sign", "event": "Dramatic Interpretation", "performer_category_as_filed": "Any Gender", "author": "Charles Fuller", "work_title": "Not specified", "publisher": "Samuel French, Inc.", "isbn": "978-0573618451", "publication_date_raw": "June 2003", "source_url": "Not specified", "literary_form": "Not speci
